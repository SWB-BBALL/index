<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.35, maximum-scale=5.0, user-scalable=yes">
  <title>FA War Room</title>
  <link rel="icon" type="image/png" href="../../00-build/database/favicon.png">
  <script src="../js/theme-preload.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/site-config.js"></script>
  <script src="../js/core.js" defer></script>
  <script src="../js/settings.js" defer></script>
  <script src="../js/fa-war-room.js" defer></script>
  <style>
    :root {
      --fa-accent: #111b36;
      --fa-accent-2: #1d3666;
      --fa-paper: #f4f2ec;
      --fa-card: #ffffff;
      --fa-soft: #faf8f2;
      --fa-ink: #111318;
      --fa-muted: #5a5246;
      --fa-line: #d9d2c2;
      --fa-good: #1f6d3d;
      --fa-warn: #9a5b00;
      --fa-bad: #9d1f1f;
      --font-sans: "Graphik", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-serif: "Tiempos Headline", "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--fa-paper);
      color: var(--fa-ink);
      font-family: var(--font-sans);
      margin: 0;
      padding: 1rem;
    }

    .fa-shell {
      display: grid;
      gap: .9rem;
      margin: 0;
      max-width: 1460px;
      min-width: 0;
    }

    body.fa-ratings-expanded .fa-shell {
      max-width: none;
    }

    .fa-header,
    .fa-panel {
      background: var(--fa-card);
      border: 1px solid var(--fa-line);
      border-top: 4px solid var(--fa-accent);
      box-shadow: 4px 4px 0 rgba(17, 27, 54, .09);
    }

    .fa-header {
      align-items: end;
      display: grid;
      gap: .8rem;
      grid-template-columns: minmax(0, 1fr) auto;
      padding: .9rem 1rem;
    }

    .fa-kicker,
    .fa-label,
    .fa-panel-title,
    .fa-status,
    .fa-chip,
    .fa-player-meta,
    .fa-warning-title,
    .fa-count {
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .fa-kicker {
      color: var(--fa-accent);
      font-size: .64rem;
      margin: 0 0 .2rem;
    }

    .fa-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 4vw, 3.1rem);
      line-height: 1;
      margin: 0;
    }

    .fa-subtitle {
      color: var(--fa-muted);
      font-size: .86rem;
      margin: .35rem 0 0;
      max-width: 74rem;
    }

    .fa-actions,
    .fa-row-actions {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
      justify-content: flex-end;
    }

    .fa-layout {
      align-items: start;
      display: grid;
      gap: .9rem;
      grid-template-columns: minmax(560px, 1.1fr) minmax(420px, .75fr);
    }

    .fa-layout.is-ratings-expanded {
      grid-template-columns: minmax(0, 1fr);
    }

    .fa-layout.is-ratings-expanded .fa-bid-panel {
      display: none;
    }

    .fa-panel {
      min-width: 0;
      padding: .82rem;
    }

    .fa-panel-head {
      align-items: baseline;
      border-bottom: 2px solid var(--fa-accent);
      display: flex;
      gap: .6rem;
      justify-content: space-between;
      margin-bottom: .7rem;
      padding-bottom: .5rem;
    }

    .fa-panel-title {
      color: var(--fa-accent);
      font-size: .84rem;
      margin: 0;
    }

    .fa-status,
    .fa-count {
      color: var(--fa-muted);
      font-size: .62rem;
      text-align: right;
    }

    .fa-grid {
      display: grid;
      gap: .55rem;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: .7rem;
    }

    .fa-grid--sheet {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .fa-control {
      display: grid;
      gap: .25rem;
      min-width: 0;
    }

    .fa-control--wide { grid-column: span 2; }

    .fa-control--toggle {
      align-content: end;
      min-height: 48px;
    }

    .fa-toggle {
      align-items: center;
      background: #fff;
      border: 1px solid #c4cde3;
      color: var(--fa-accent);
      cursor: pointer;
      display: inline-flex;
      font-size: .72rem;
      font-weight: 850;
      gap: .42rem;
      height: 34px;
      letter-spacing: .06em;
      padding: 0 .58rem;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .fa-toggle input {
      accent-color: var(--fa-accent);
      height: .95rem;
      margin: 0;
      width: .95rem;
    }

    .fa-label {
      color: var(--fa-muted);
      font-size: .6rem;
    }

    .fa-input,
    .fa-select,
    .fa-textarea,
    .fa-button {
      border: 1px solid #c4cde3;
      color: var(--fa-ink);
      font: inherit;
      font-size: .8rem;
      min-width: 0;
    }

    .fa-input,
    .fa-select {
      background: #fff;
      height: 34px;
      padding: 0 .5rem;
      width: 100%;
    }

    .fa-textarea {
      background: #fff;
      min-height: 104px;
      padding: .55rem;
      resize: vertical;
      width: 100%;
    }

    .fa-button {
      align-items: center;
      background: var(--fa-accent);
      color: #fff;
      cursor: pointer;
      display: inline-flex;
      font-weight: 800;
      gap: .3rem;
      height: 34px;
      justify-content: center;
      letter-spacing: .07em;
      padding: 0 .72rem;
      text-decoration: none;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .fa-button--secondary {
      background: #fff;
      color: var(--fa-accent);
    }

    .fa-button--danger {
      background: var(--fa-bad);
    }

    .fa-button[disabled] {
      cursor: not-allowed;
      opacity: .48;
    }

    .fa-chip {
      background: var(--fa-soft);
      border: 1px solid var(--fa-line);
      color: var(--fa-muted);
      display: inline-flex;
      font-size: .58rem;
      gap: .28rem;
      line-height: 1;
      padding: .34rem .42rem;
      white-space: nowrap;
    }

    .fa-chip strong {
      color: var(--fa-accent);
    }

    .fa-table-wrap {
      border: 1px solid var(--fa-line);
      max-height: 660px;
      overflow: auto;
    }

    .fa-table {
      border-collapse: collapse;
      font-size: .78rem;
      min-width: 1060px;
      width: 100%;
    }

    .fa-table.is-expanded {
      min-width: 1740px;
    }

    .fa-table th,
    .fa-table td {
      border-bottom: 1px solid #e7e0d1;
      padding: .42rem .46rem;
      text-align: left;
      vertical-align: middle;
    }

    .fa-table th {
      background: var(--fa-accent);
      color: #fff;
      font-size: .58rem;
      font-weight: 800;
      letter-spacing: .11em;
      position: sticky;
      text-transform: uppercase;
      top: 0;
      z-index: 2;
    }

    .fa-sort {
      align-items: center;
      background: transparent;
      border: 0;
      color: inherit;
      cursor: pointer;
      display: inline-flex;
      font: inherit;
      font-size: inherit;
      font-weight: inherit;
      gap: .25rem;
      justify-content: inherit;
      letter-spacing: inherit;
      padding: 0;
      text-align: inherit;
      text-transform: inherit;
      width: 100%;
    }

    .fa-sort::after {
      color: rgba(255, 255, 255, .7);
      content: "S";
      font-size: .58rem;
      line-height: 1;
    }

    .fa-sort.is-active::after {
      color: #fff;
      content: "D";
    }

    .fa-sort.is-active.is-asc::after {
      content: "A";
    }

    .fa-table td:first-child,
    .fa-table th:first-child {
      left: 0;
      position: sticky;
      z-index: 1;
    }

    .fa-table th:first-child { z-index: 3; }
    .fa-table td:first-child { background: #fff; }

    .fa-col-pos,
    .fa-col-age,
    .fa-col-height,
    .fa-col-rating {
      text-align: center;
      white-space: nowrap;
      width: 3.25rem;
    }

    .fa-col-age {
      width: 3rem;
    }

    .fa-col-rating {
      width: 3.75rem;
    }

    .fa-col-height {
      width: 3.5rem;
    }

    .fa-col-personality {
      text-align: center;
      white-space: nowrap;
      width: 4.25rem;
    }

    .fa-col-skill {
      font-weight: 850;
      text-align: center;
      white-space: nowrap;
      width: 3.1rem;
    }

    .fa-table tr {
      cursor: pointer;
    }

    .fa-table tr:hover td,
    .fa-table tr.is-selected td {
      background: #f7f1df;
    }

    .fa-player-link {
      color: var(--fa-accent);
      font-weight: 850;
      text-decoration: none;
    }

    .fa-player-link:hover {
      text-decoration: underline;
    }

    .fa-rating {
      background: var(--fa-accent);
      color: #fff;
      display: inline-block;
      font-weight: 850;
      min-width: 2.25rem;
      padding: .18rem .28rem;
      text-align: center;
    }

    .fa-rating.rating-purple { background: #7e22ce; color: #fff; }
    .fa-rating.rating-blue { background: #1d4ed8; color: #fff; }
    .fa-rating.rating-green { background: #15803d; color: #fff; }
    .fa-rating.rating-yellow { background: #facc15; color: #1f2937; }
    .fa-rating.rating-orange { background: #f97316; color: #fff; }

    .fa-sheet-list {
      display: grid;
      gap: .5rem;
      margin-top: .7rem;
    }

    .fa-empty {
      border: 1px dashed #c4cde3;
      color: var(--fa-muted);
      font-size: .8rem;
      padding: .75rem;
      text-align: center;
    }

    .fa-bid-row {
      border: 1px solid var(--fa-line);
      display: grid;
      gap: .45rem;
      grid-template-columns: minmax(0, 1fr) auto;
      padding: .55rem;
    }

    .fa-bid-main {
      min-width: 0;
    }

    .fa-bid-name {
      color: var(--fa-accent);
      font-weight: 900;
    }

    .fa-bid-meta {
      color: var(--fa-muted);
      font-size: .74rem;
      margin-top: .18rem;
    }

    .fa-warning-list {
      display: grid;
      gap: .35rem;
      margin-bottom: .7rem;
    }

    .fa-warning {
      border-left: 4px solid var(--fa-warn);
      background: #fff7e1;
      color: #5e3a00;
      font-size: .76rem;
      padding: .48rem .55rem;
    }

    .fa-warning--bad {
      border-left-color: var(--fa-bad);
      background: #fff1f1;
      color: #6f1212;
    }

    .fa-warning-title {
      display: block;
      font-size: .58rem;
      margin-bottom: .14rem;
    }

    .fa-output {
      background: #fff;
      border: 1px solid var(--fa-line);
      color: var(--fa-ink);
      font-family: "Consolas", "SFMono-Regular", monospace;
      font-size: .75rem;
      min-height: 190px;
      padding: .65rem;
      resize: vertical;
      width: 100%;
    }

    .fa-rules {
      border: 1px solid var(--fa-line);
      background: var(--fa-soft);
      color: var(--fa-muted);
      display: grid;
      gap: .38rem;
      font-size: .73rem;
      line-height: 1.35;
      margin: .6rem 0 .7rem;
      padding: .62rem;
    }

    .fa-rules-title {
      color: var(--fa-accent);
      font-size: .6rem;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .fa-rules-list {
      display: grid;
      gap: .18rem;
    }

    .fa-rules strong {
      color: var(--fa-ink);
    }

    .fa-player-popover {
      background: #fffdf8;
      border: 1px solid color-mix(in srgb, var(--fa-accent) 32%, var(--fa-line));
      border-top: 4px solid var(--fa-accent);
      box-shadow: 0 18px 42px rgba(15, 23, 42, .22);
      color: var(--fa-ink);
      display: none;
      font-size: .84rem;
      left: 0;
      max-width: min(390px, calc(100vw - 24px));
      padding: .72rem;
      pointer-events: none;
      position: fixed;
      top: 0;
      width: 368px;
      z-index: 120;
    }

    .fa-player-popover.is-open {
      display: block;
    }

    .fa-popover-head {
      align-items: flex-start;
      border-bottom: 1px solid var(--fa-line);
      display: flex;
      gap: .65rem;
      justify-content: space-between;
      margin-bottom: .52rem;
      padding-bottom: .48rem;
    }

    .fa-popover-name {
      color: var(--fa-accent);
      font-family: var(--font-sans);
      font-size: 1.2rem;
      font-weight: 900;
      line-height: 1.08;
      margin: 0;
    }

    .fa-popover-meta {
      color: var(--fa-muted);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .08em;
      margin-top: .25rem;
      text-transform: uppercase;
    }

    .fa-popover-overall {
      display: grid;
      flex: 0 0 auto;
      justify-items: end;
      min-width: 3.7rem;
      text-align: right;
    }

    .fa-popover-overall strong {
      color: var(--fa-accent);
      font-size: 1.56rem;
      font-weight: 950;
      line-height: .9;
    }

    .fa-popover-overall span,
    .fa-popover-overall small {
      color: var(--fa-muted);
      font-size: .6rem;
      font-weight: 900;
      letter-spacing: .09em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .fa-popover-ratings {
      display: grid;
      gap: .32rem;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .fa-popover-rating-group {
      background: var(--fa-soft);
      border: 1px solid var(--fa-line);
      min-width: 0;
      padding: .38rem .34rem;
    }

    .fa-popover-rating-group h4 {
      color: var(--fa-accent);
      font-size: .62rem;
      font-weight: 950;
      letter-spacing: .12em;
      margin: 0 0 .24rem;
      text-transform: uppercase;
    }

    .fa-popover-rating {
      align-items: baseline;
      border-bottom: 1px solid rgba(217, 210, 194, .68);
      display: flex;
      gap: .12rem;
      justify-content: space-between;
      line-height: 1.12;
      padding: .08rem 0;
    }

    .fa-popover-rating:last-child {
      border-bottom: 0;
    }

    .fa-popover-rating span {
      color: var(--fa-muted);
      font-size: .76rem;
      font-weight: 900;
    }

    .fa-popover-rating strong {
      color: var(--fa-ink);
      font-size: .78rem;
      font-weight: 950;
      margin-left: auto;
    }

    .fa-popover-rating em {
      color: var(--fa-muted);
      font-size: .66rem;
      font-style: normal;
      font-weight: 900;
      min-width: 1.15rem;
      text-align: left;
    }

    .fa-popover-stats {
      background: var(--fa-accent);
      color: #fff;
      margin-top: .5rem;
      padding: .48rem;
    }

    .fa-popover-stats h4 {
      color: rgba(255, 255, 255, .78);
      font-size: .66rem;
      font-weight: 950;
      letter-spacing: .14em;
      margin: 0 0 .32rem;
      text-transform: uppercase;
    }

    .fa-popover-stat-grid {
      display: grid;
      gap: .35rem;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .fa-popover-stat span {
      color: rgba(255, 255, 255, .76);
      display: block;
      font-size: .64rem;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .fa-popover-stat strong {
      color: #fff;
      display: block;
      font-size: 1.28rem;
      font-weight: 950;
      line-height: 1;
    }

    .fa-popover-title {
      color: var(--fa-accent);
      font-size: .58rem;
      font-weight: 900;
      letter-spacing: .12em;
      margin: 0 0 .36rem;
      text-transform: uppercase;
    }

    .fa-drawer-backdrop {
      background: rgba(10, 15, 26, .38);
      inset: 0;
      opacity: 0;
      pointer-events: none;
      position: fixed;
      transition: opacity .16s ease;
      z-index: 80;
    }

    .fa-drawer {
      background: var(--fa-card);
      border-left: 1px solid var(--fa-line);
      box-shadow: -10px 0 24px rgba(17, 27, 54, .16);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100%;
      max-width: 440px;
      min-width: min(100vw, 360px);
      position: fixed;
      right: 0;
      top: 0;
      transform: translateX(105%);
      transition: transform .18s ease;
      width: 36vw;
      z-index: 90;
    }

    body.fa-drawer-open .fa-drawer {
      transform: translateX(0);
    }

    body.fa-drawer-open .fa-drawer-backdrop {
      opacity: 1;
      pointer-events: auto;
    }

    .fa-drawer-head {
      background: var(--fa-accent);
      color: #fff;
      padding: .85rem;
    }

    .fa-drawer-top {
      align-items: start;
      display: flex;
      gap: .5rem;
      justify-content: space-between;
    }

    .fa-drawer-title {
      font-family: var(--font-serif);
      font-size: 1.65rem;
      line-height: 1.02;
      margin: 0;
    }

    .fa-player-meta {
      color: rgba(255, 255, 255, .78);
      font-size: .62rem;
      margin-top: .3rem;
    }

    .fa-drawer-body {
      display: grid;
      gap: .8rem;
      min-height: 0;
      overflow: auto;
      padding: .85rem;
    }

    .fa-mini-grid {
      display: grid;
      gap: .45rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .fa-mini-card {
      border: 1px solid var(--fa-line);
      padding: .48rem;
    }

    .fa-mini-label {
      color: var(--fa-muted);
      display: block;
      font-size: .58rem;
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .fa-mini-value {
      display: block;
      font-size: .95rem;
      font-weight: 900;
      margin-top: .12rem;
    }

    .fa-drawer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
    }

    .fa-check {
      align-items: center;
      display: flex;
      gap: .4rem;
      font-size: .82rem;
      font-weight: 800;
    }

    .fa-check input {
      accent-color: var(--fa-accent);
      height: 16px;
      width: 16px;
    }

    @media (max-width: 1100px) {
      body { padding: .65rem; }
      .fa-header,
      .fa-layout {
        grid-template-columns: 1fr;
      }
      .fa-actions {
        justify-content: flex-start;
      }
      .fa-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      .fa-grid,
      .fa-grid--sheet,
      .fa-mini-grid {
        grid-template-columns: 1fr;
      }
      .fa-control--wide {
        grid-column: auto;
      }
      .fa-drawer {
        max-width: none;
        min-width: 0;
        width: 100vw;
      }
    }
  </style>
</head>
<body>
  <main class="fa-shell">
    <header class="fa-header">
      <div>
        <p class="fa-kicker">Free Agency Tool</p>
        <h1 class="fa-title">FA War Room</h1>
        <p class="fa-subtitle">Build a bid sheet, track re-signing targets, stay inside round limits, and copy a clean commissioner DM.</p>
      </div>
      <div class="fa-actions">
        <a class="fa-button fa-button--secondary" href="../../freeagents.htm">Raw FA List</a>
        <a class="fa-button fa-button--secondary" href="../../index.htm">League Home</a>
      </div>
    </header>

    <section class="fa-layout" id="fa-layout">
      <article class="fa-panel">
        <div class="fa-panel-head">
          <h2 class="fa-panel-title">Free Agents</h2>
          <span class="fa-status" id="fa-list-status">Loading</span>
        </div>

        <div class="fa-grid">
          <label class="fa-control fa-control--wide">
            <span class="fa-label">Search</span>
            <input class="fa-input" id="fa-search" type="search" placeholder="Player name">
          </label>
          <label class="fa-control">
            <span class="fa-label">Position</span>
            <select class="fa-select" id="fa-position"></select>
          </label>
          <label class="fa-control">
            <span class="fa-label">Min OVR</span>
            <input class="fa-input" id="fa-min-ovr" type="number" min="0" step="1" placeholder="Any">
          </label>
          <label class="fa-control">
            <span class="fa-label">Max Age</span>
            <input class="fa-input" id="fa-max-age" type="number" min="0" step="1" placeholder="Any">
          </label>
          <label class="fa-control">
            <span class="fa-label">Personality</span>
            <select class="fa-select" id="fa-personality">
              <option value="">Any</option>
              <option value="winner">Winner 70+</option>
              <option value="loyalty">Loyalty 70+</option>
              <option value="greed">Greed 70+</option>
              <option value="happy">Happiness 70+</option>
            </select>
          </label>
          <label class="fa-control">
            <span class="fa-label">Re-signings</span>
            <select class="fa-select" id="fa-bird-filter">
              <option value="">Any</option>
              <option value="eligible">My re-signing players</option>
              <option value="known">Known last team</option>
              <option value="unknown">Unknown last team</option>
            </select>
          </label>
          <label class="fa-control fa-control--toggle">
            <span class="fa-toggle">
              <input id="fa-show-ratings" type="checkbox">
              Ratings
            </span>
          </label>
        </div>

        <div class="fa-table-wrap">
          <table class="fa-table" id="fa-player-table">
            <thead id="fa-player-head"></thead>
            <tbody id="fa-player-body">
              <tr><td colspan="11">Loading free agents...</td></tr>
            </tbody>
          </table>
        </div>
      </article>

      <aside class="fa-panel fa-bid-panel">
        <div class="fa-panel-head">
          <h2 class="fa-panel-title">Bid Sheet</h2>
          <span class="fa-count" id="fa-bid-count">0 bids</span>
        </div>

        <div class="fa-grid fa-grid--sheet">
          <label class="fa-control">
            <span class="fa-label">Team</span>
            <select class="fa-select" id="fa-team"></select>
          </label>
          <label class="fa-control">
            <span class="fa-label">Round</span>
            <select class="fa-select" id="fa-round">
              <option value="round1">Round 1</option>
              <option value="round2">Round 2</option>
              <option value="round3">Round 3 + Preseason</option>
            </select>
          </label>
        </div>

        <section class="fa-rules" aria-label="Salary cap and contract rules">
          <div class="fa-rules-title">Salary Cap & Contract Rules</div>
          <div class="fa-rules-list" id="fa-rules-list"></div>
        </section>

        <div class="fa-warning-list" id="fa-warnings"></div>
        <div class="fa-sheet-list" id="fa-bid-list"></div>

        <div class="fa-panel-head" style="margin-top:.85rem;">
          <h2 class="fa-panel-title">Commissioner Copy</h2>
          <button class="fa-button" id="fa-copy" type="button">Copy</button>
        </div>
        <textarea class="fa-output" id="fa-output" readonly></textarea>
      </aside>
    </section>
  </main>

  <div class="fa-drawer-backdrop" id="fa-drawer-backdrop"></div>
  <div class="fa-player-popover" id="fa-player-popover" role="tooltip"></div>
  <aside class="fa-drawer" id="fa-drawer" aria-hidden="true">
    <div class="fa-drawer-head">
      <div class="fa-drawer-top">
        <div>
          <h2 class="fa-drawer-title" id="fa-drawer-name">Player</h2>
          <div class="fa-player-meta" id="fa-drawer-meta"></div>
        </div>
        <button class="fa-button fa-button--secondary" id="fa-close" type="button">Close</button>
      </div>
    </div>
    <div class="fa-drawer-body">
      <div class="fa-mini-grid" id="fa-drawer-cards"></div>

      <label class="fa-control">
        <span class="fa-label">Starting Salary</span>
        <input class="fa-input" id="fa-salary" type="text" placeholder="Min">
      </label>
      <label class="fa-control">
        <span class="fa-label">Annual % Increase</span>
        <select class="fa-select" id="fa-raise"></select>
      </label>
      <label class="fa-control">
        <span class="fa-label">Years</span>
        <input class="fa-input" id="fa-years" type="number" min="1" step="1" value="1" placeholder="1">
      </label>
      <label class="fa-check">
        <input id="fa-bird" type="checkbox">
        Bird Rights bid
      </label>
      <label class="fa-control">
        <span class="fa-label">GM Notes</span>
        <textarea class="fa-textarea" id="fa-notes" placeholder="Not copied to Discord"></textarea>
      </label>
      <div class="fa-drawer-actions">
        <button class="fa-button" id="fa-save-bid" type="button">Add Bid</button>
        <button class="fa-button fa-button--danger" id="fa-remove-bid" type="button">Remove</button>
        <a class="fa-button fa-button--secondary" id="fa-open-player" href="#" target="_blank" rel="noopener">Open Player</a>
      </div>
    </div>
  </aside>
</body>
</html>
