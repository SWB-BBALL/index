<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>League Rules</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/theme.css">
  <script src="../js/site-config.js"></script>
  <script src="../js/core.js" defer></script>
  <style>
    .rules-shell{max-width:1080px;margin:0 auto;padding:28px 18px 48px}
    .rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
    .rules-card{background:var(--league-surface,#fff);border:1px solid var(--league-border,#ccd5e2);border-radius:var(--league-corner-radius,4px);padding:18px}
    .rules-card h2{margin:0 0 12px}.rules-list{margin:0;padding-left:20px}.rules-list li{margin:7px 0}
  </style>
<link rel="icon" href="../branding/favicon.png">
</head>
<body>
  <main class="rules-shell">
    <header><p>League Governance</p><h1 id="rulesTitle">League Rules</h1><p id="rulesIntro"></p></header>
    <div class="rules-grid" id="rulesRoot"></div>
  </main>
  <script>
  (function () {
    var config = window.LeagueSiteConfig || {};
    var rules = config.rules || {};
    var publication = rules.publication || {};
    document.getElementById("rulesTitle").textContent = publication.title || "League Rules";
    document.getElementById("rulesIntro").textContent = publication.introduction || "";
    function money(value) { return value == null ? "Not configured" : "$" + Number(value).toLocaleString(); }
    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function (character) {
        return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character];
      });
    }
    function card(title, rows) {
      return '<section class="rules-card"><h2>' + title + '</h2><ul class="rules-list">' +
        rows.map(function (row) { return "<li>" + row + "</li>"; }).join("") + "</ul></section>";
    }
    function description(section) {
      return section.publicDescription ? ["<em>" + escapeHtml(section.publicDescription) + "</em>"] : [];
    }
    function visible(section) { return section.visible !== false; }
    var finance = rules.finance || {}, contracts = rules.contracts || {}, trades = rules.trades || {}, camps = rules.camps || {};
    var tiers = ((config.competitions || {}).tiers || []).map(function (tier) {
      var percentage = tier.salaryCap && tier.salaryFloor != null
        ? " (" + (Number(tier.salaryFloor) / Number(tier.salaryCap) * 100).toFixed(1).replace(/\.0$/, "") + "%)"
        : "";
      if (finance.softCapEnabled) {
        return tier.label + ": soft cap " + money(tier.salaryCap) +
          (tier.hardCap == null ? "" : ", hard cap " + money(tier.hardCap)) +
          ", floor " + money(tier.salaryFloor) + percentage;
      }
      return tier.label + ": hard cap " +
        money(tier.hardCap == null ? tier.salaryCap : tier.hardCap) +
        ", floor " + money(tier.salaryFloor) + percentage;
    });
    var cards = [];
    if (visible(finance)) cards.push(card("Salary Cap", description(finance).concat(
      tiers.length ? tiers : ["No tier financial limits configured"],
      [finance.softCapEnabled
         ? "Soft cap enabled: teams may exceed it only through configured exceptions"
         : "Hard cap enforcement: " + (finance.hardCapEnforced ? "Yes" : "Commissioner checklist"),
       "Salary floor enforcement: " + (finance.floorEnforced ? "Yes" : "Commissioner checklist")]
    )));
    if (visible(contracts)) cards.push(card("Contracts", description(contracts).concat([
        "Maximum term: " + contracts.maxYears + " years",
        "Bird Rights maximum: " + contracts.birdMaxYears + " years after " + contracts.birdEligibilityYears + " consecutive years",
        "Annual increases: " + contracts.maxAnnualIncreasePercent + "% standard / " + contracts.birdMaxAnnualIncreasePercent + "% Bird Rights",
        "Minimum contract: " + money(contracts.minimumSalary) +
          (finance.softCapEnabled ? " (permitted above the soft cap)" : ""),
        "Starting salary limits: " + money(contracts.oneYearMaxSalary) + " standard one-year / " +
          money(contracts.birdOneYearMaxSalary) + " Bird one-year / " + money(contracts.multiYearMaxStartingSalary) + " multi-year"
      ])));
    if (visible(trades)) cards.push(card("Trades", description(trades).concat([
        "Maximum teams: " + trades.maxTeams,
        "Maximum roster size: " + trades.maxRosterSize,
        finance.softCapEnabled
          ? "Over-cap trade matching: incoming salary may not exceed " + trades.salaryMatchPercent + "% of outgoing salary"
          : "Trades must remain under the hard cap",
        "Trade-back waiting period: " + trades.tradeBackHours + " hours",
        "Cut and re-sign waiting period: " + trades.cutReSignHours + " hours"
      ])));
    var customCampRules = Array.isArray(camps.customRules)
      ? camps.customRules.filter(function (rule) { return rule && rule.visible !== false; })
      : [];
    if (visible(camps)) cards.push(card("Camps", description(camps).concat([
        "Maximum camps per player per season: " + camps.maxPerPlayerSeason,
        "Development Camp maximum age: " + camps.developmentMaxAge
      ], customCampRules.map(function (rule) {
        return "<strong>" + escapeHtml(rule.title || "Additional rule") + ":</strong> " +
          escapeHtml(rule.description || "");
      }))));
    document.getElementById("rulesRoot").innerHTML = cards.join("");
  }());
  </script>
</body>
</html>
