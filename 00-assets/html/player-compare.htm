<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.35, maximum-scale=5.0, user-scalable=yes">
  <title>Player Compare</title>
  <link rel="icon" type="image/png" href="../../00-build/database/favicon.png">
  <script src="../js/theme-preload.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/unified-components.css">
  <script src="../js/unified-ui.js"></script>
  <script src="../js/site-config.js"></script>
  <script src="../js/core.js" defer></script>
  <script src="../js/settings.js" defer></script>
  <script src="../js/player-compare.js" defer></script>
  <style>
    :root {
      --team-color: var(--ui-navy);
      --team-color-2: var(--ui-blue);
      --ui-team: var(--team-color);
      --ui-team-secondary: var(--team-color-2);
      --ink: var(--ui-ink);
      --muted: var(--ui-muted);
      --paper: var(--ui-paper);
      --card: var(--ui-card);
      --line: var(--ui-line);
      --soft: var(--ui-soft);
      --best: #e8f5ec;
      --best-line: #86c597;
      --bad: var(--ui-bad);
      --font-sans: var(--ui-font);
    }

    * { box-sizing: border-box; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      margin: 0;
      padding: .85rem;
    }

    a { color: #1d4ed8; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .compare-shell {
      display: grid;
      gap: .75rem;
      max-width: min(1360px, calc(100vw - 1.7rem));
      min-width: 0;
      width: 100%;
    }

    .topbar,
    .compare-hero,
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
    }

    .compare-hero {
      border-left: 6px solid var(--team-color);
      display: grid;
      gap: .75rem;
      grid-template-columns: minmax(0, 1fr) auto;
      padding: .72rem;
    }

    .compare-title {
      font-size: clamp(1.5rem, 3vw, 2.05rem);
      letter-spacing: 0;
      line-height: 1.04;
      margin: 0;
    }

    .compare-subtitle {
      color: var(--muted);
      margin: .28rem 0 0;
    }

    .nav-actions,
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
    }

    .btn-link,
    .slot-clear {
      align-items: center;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      font: inherit;
      font-size: .76rem;
      font-weight: 800;
      justify-content: center;
      min-height: 30px;
      padding: .32rem .48rem;
      text-decoration: none;
    }

    .btn-link:hover,
    .slot-clear:hover,
    .slot-search:focus {
      border-color: var(--team-color);
      text-decoration: none;
    }

    .topbar {
      display: grid;
      gap: .55rem;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      padding: .6rem;
    }

    .topbar.has-two-slots {
      grid-template-columns: repeat(2, minmax(0, 1fr)) auto;
    }

    .topbar.has-three-slots {
      grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(92px, auto);
    }

    .add-slot-wrap {
      align-self: end;
      display: grid;
    }

    .slot-control {
      display: grid;
      gap: .28rem;
      min-width: 0;
      position: relative;
    }

    .slot-label,
    .panel-title,
    .stat-label,
    .card-meta,
    .empty-slot-kicker {
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .slot-label {
      color: var(--muted);
      font-size: .62rem;
    }

    .slot-row {
      display: grid;
      gap: .3rem;
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .slot-search {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      font: inherit;
      min-height: 32px;
      min-width: 0;
      padding: .34rem .42rem;
      width: 100%;
    }

    .slot-results {
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 10px 24px rgba(15, 23, 42, .16);
      left: 0;
      max-height: min(320px, 62vh);
      overflow: auto;
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      z-index: 30;
    }

    .slot-results[hidden] { display: none; }

    .slot-option {
      align-items: center;
      background: #fff;
      border: 0;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      gap: .5rem;
      justify-content: space-between;
      min-height: 34px;
      padding: .42rem .5rem;
      text-align: left;
      width: 100%;
    }

    .slot-option:hover,
    .slot-option.active { background: #f1f5f9; }
    .slot-option strong { font-size: .82rem; }
    .slot-option span { color: var(--muted); flex: 0 0 auto; font-size: .64rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }

    .compare-cards {
      display: grid;
      gap: .65rem;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .compare-cards.has-two-slots {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .compare-cards.has-three-slots {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .player-card {
      align-content: start;
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 5px solid var(--slot-color, var(--team-color));
      display: grid;
      gap: .35rem;
      min-width: 0;
      padding: .5rem;
    }

    .player-card.is-empty {
      border-left-color: var(--line);
      color: var(--muted);
    }

    .player-card-name {
      color: var(--ink);
      font-size: .95rem;
      font-weight: 950;
      line-height: 1.1;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .player-card-name a {
      color: inherit;
      text-decoration: none;
    }

    .player-card-name a:hover,
    .player-card-name a:focus {
      color: var(--slot-color, var(--team-color));
      text-decoration: underline;
    }

    .card-meta {
      color: var(--muted);
      font-size: .61rem;
      line-height: 1.35;
      min-height: 1rem;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: .25rem;
    }

    .rating-chip,
    .info-chip {
      align-items: center;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      display: inline-flex;
      font-size: .68rem;
      font-weight: 850;
      min-height: 23px;
      padding: .16rem .34rem;
      white-space: nowrap;
    }

    .rating-chip.primary {
      background: var(--slot-color, var(--team-color));
      border-color: var(--slot-color, var(--team-color));
      color: #fff;
    }

    .rating-chip.rating-purple { background: #7e22ce; border-color: #7e22ce; color: #fff; }
    .rating-chip.rating-blue { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
    .rating-chip.rating-green { background: #15803d; border-color: #15803d; color: #fff; }
    .rating-chip.rating-yellow { background: #facc15; border-color: #eab308; color: #1f2937; }
    .rating-chip.rating-orange { background: #f97316; border-color: #ea580c; color: #fff; }

    .injury-chip {
      background: #fff1f0;
      border-color: #ffc9c4;
      color: var(--bad);
    }

    .card-statline {
      display: grid;
      gap: .22rem;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      min-height: 35px;
    }

    .card-stat {
      border-top: 1px solid var(--line);
      padding-top: .22rem;
    }

    .card-stat strong {
      color: var(--slot-color, var(--team-color));
      display: block;
      font-size: .92rem;
      line-height: 1;
    }

    .card-stat span {
      color: var(--muted);
      display: block;
      font-size: .55rem;
      font-weight: 900;
      letter-spacing: .12em;
      margin-top: .12rem;
      text-transform: uppercase;
    }

    .compare-tabs {
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
      padding: .45rem;
      position: sticky;
      top: 116px;
      z-index: 19;
    }

    .tab-btn {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: .7rem;
      font-weight: 900;
      min-height: 30px;
      padding: .32rem .48rem;
      text-transform: uppercase;
    }

    .tab-btn.active {
      background: var(--team-color);
      border-color: var(--team-color);
      color: #fff;
    }

    .compare-section[hidden] {
      display: none;
    }

    .ratings-grid,
    .stats-card-grid {
      display: grid;
      gap: .65rem;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      padding: .65rem;
    }

    .stats-card-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .rating-card,
    .stat-card {
      border: 1px solid var(--line);
      background: #fff;
      min-width: 0;
    }

    .rating-card-title,
    .stat-card-title {
      background: #f1f5f9;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: .64rem;
      font-weight: 900;
      letter-spacing: .12em;
      margin: 0;
      padding: .42rem .5rem;
      text-transform: uppercase;
    }

    .rating-compare-row,
    .stat-compare-row {
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: .38rem;
      grid-template-columns: minmax(86px, .8fr) repeat(var(--visible-slots, 2), minmax(40px, 1fr));
      padding: .38rem .48rem;
    }

    .rating-compare-row:last-child { border-bottom: 0; }
    .stat-compare-row:last-child { border-bottom: 0; }

    .rating-name,
    .stat-name {
      color: var(--ink);
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .rating-mini,
    .stat-mini {
      background: #f8fafc;
      border: 1px solid var(--line);
      font-size: .78rem;
      font-weight: 950;
      min-height: 24px;
      padding: .16rem .25rem;
      text-align: center;
    }

    .rating-mini.is-best,
    .stat-mini.is-best {
      background: var(--best);
      border-color: var(--best-line);
      box-shadow: inset 3px 0 0 var(--best-line);
    }

    .panel {
      min-width: 0;
      overflow: hidden;
    }

    .panel-head {
      align-items: baseline;
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: .5rem;
      justify-content: space-between;
      padding: .5rem .6rem;
    }

    .panel-title {
      color: var(--ink);
      font-size: .76rem;
      margin: 0;
    }

    .note {
      color: var(--muted);
      font-size: .72rem;
    }

    .compare-table-wrap {
      overflow: auto;
      width: 100%;
    }

    .compare-table {
      border-collapse: separate;
      border-spacing: 0;
      min-width: 720px;
      width: 100%;
    }

    .compare-table th,
    .compare-table td {
      border-bottom: 1px solid var(--line);
      font-size: .78rem;
      padding: .34rem .44rem;
      text-align: right;
      white-space: nowrap;
    }

    .compare-table th {
      background: #f1f5f9;
      color: var(--muted);
      font-size: .64rem;
      font-weight: 900;
      letter-spacing: .1em;
      position: sticky;
      text-transform: uppercase;
      top: 0;
      z-index: 2;
    }

    .compare-table th:first-child,
    .compare-table td:first-child {
      left: 0;
      min-width: 118px;
      position: sticky;
      text-align: left;
      width: 118px;
      z-index: 3;
    }

    .compare-table th:first-child {
      z-index: 4;
    }

    .compare-table tbody tr:nth-child(odd) td { background: #fff; }
    .compare-table tbody tr:nth-child(even) td { background: #f8fafc; }
    .compare-table tbody tr td.is-best { background: var(--best) !important; box-shadow: inset 3px 0 0 var(--best-line); font-weight: 950; }
    .compare-table .group-row td {
      background: #eef2f6 !important;
      color: var(--muted);
      font-size: .62rem;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .empty-slot-kicker {
      color: var(--muted);
      font-size: .62rem;
    }

    @media (max-width: 1120px) {
      .topbar,
      .compare-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar.has-two-slots,
      .topbar.has-three-slots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .compare-cards.has-three-slots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .ratings-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stats-card-grid { grid-template-columns: 1fr; }
      .compare-tabs { top: 0; position: sticky; }
      .add-slot-wrap { grid-column: 1 / -1; }
      .compare-hero { grid-template-columns: 1fr; }
      .hero-actions { justify-content: flex-start; }
    }

    @media (max-width: 680px) {
      body { padding: .55rem; }
      .compare-shell { max-width: 100%; }
      .topbar,
      .compare-cards { grid-template-columns: 1fr; }
      .topbar.has-two-slots,
      .topbar.has-three-slots { grid-template-columns: 1fr; }
      .compare-cards.has-two-slots,
      .compare-cards.has-three-slots { grid-template-columns: 1fr; }
      .compare-cards { position: static; }
      .ratings-grid { grid-template-columns: 1fr; padding: .5rem; }
      .stats-card-grid { grid-template-columns: 1fr; padding: .5rem; }
      .rating-compare-row { grid-template-columns: minmax(84px, .8fr) repeat(var(--visible-slots, 2), minmax(36px, 1fr)); }
      .stat-compare-row { grid-template-columns: minmax(84px, .8fr) repeat(var(--visible-slots, 2), minmax(36px, 1fr)); }
      .compare-tabs { position: sticky; top: 0; }
      .nav-actions,
      .hero-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .btn-link,
      .slot-clear { width: 100%; }
      .compare-table { min-width: 620px; }
      .compare-table th,
      .compare-table td { padding: .36rem .42rem; }
    }
  </style>
</head>
<body class="ui-page">
  <main class="compare-shell ui-shell">
    <header class="compare-hero ui-identity-banner">
      <div>
        <h1 class="compare-title">Player Compare</h1>
        <p class="compare-subtitle">Compare up to four live league players across ratings, current-season production, shooting, and efficiency.</p>
      </div>
      <nav class="hero-actions" aria-label="Compare navigation">
        <a class="btn-link ui-button" href="./league%20dashboard.htm">Dashboard</a>
        <a class="btn-link ui-button" href="../../index.htm" target="_top">League Home</a>
      </nav>
    </header>

    <section class="topbar ui-panel" id="slotControls" aria-label="Player selectors"></section>
    <section class="compare-cards" id="playerCards"></section>
    <nav class="compare-tabs ui-tabs" id="compareTabs" aria-label="Compare sections"></nav>

    <section class="panel ui-panel compare-section" id="section-ratings">
      <div class="panel-head ui-panel-head">
        <h2 class="panel-title ui-panel-title">Ratings</h2>
        <div class="note">Best value highlighted</div>
      </div>
      <div id="ratingsTable"></div>
    </section>

    <section class="panel ui-panel compare-section" id="section-potential">
      <div class="panel-head ui-panel-head">
        <h2 class="panel-title ui-panel-title">Potential Grades</h2>
        <div class="note">Letter grades by rating</div>
      </div>
      <div id="potentialTable"></div>
    </section>

    <section class="panel ui-panel compare-section" id="section-current">
      <div class="panel-head ui-panel-head">
        <h2 class="panel-title ui-panel-title">Stats / Shooting / Efficiency</h2>
        <div class="note">Latest numeric season row</div>
      </div>
      <div id="statsCards"></div>
    </section>
  </main>
</body>
</html>
