    function heroAwardKind(label) {
      const key = normalizeAccoladeKey(label);
      if (isLeagueChampionship(label)) return "championship";
      if (/defensive|defense/.test(key)) return "defense";
      if (/mvp|player of the year/.test(key)) return "mvp";
      return "league";
    }

    function isLeagueChampionship(label) {
      const key = normalizeAccoladeKey(label);
      return /^(champion|championships?)$/.test(key) || /league basketball champion/.test(key);
    }

    function heroAwardPriority(label) {
      const key = normalizeAccoladeKey(label);
      if (isLeagueChampionship(label)) return 0;
      if (/defensive player of the year/.test(key)) return 2;
      if (/rookie of the year/.test(key)) return 3;
      if (/all-star game mvp/.test(key)) return 9;
      if (/rookie game mvp/.test(key)) return 16;
      if (/most valuable|\bmvp\b|player of the year/.test(key)) return 1;
      if (/all-league first/.test(key)) return 4;
      if (/all-league second/.test(key)) return 5;
      if (/all-defensive first/.test(key)) return 6;
      if (/all-league third/.test(key)) return 7;
      if (/all-defensive second/.test(key)) return 8;
      if (/all-star/.test(key)) return 10;
      if (/scoring leader|assists leader|rebounds leader|steals leader|blocks leader/.test(key)) return 11;
      if (/most improved player|sixth man of the year/.test(key)) return 12;
      if (/all-rookie first/.test(key)) return 13;
      if (/all-rookie second/.test(key)) return 14;
      if (/3-point shootout champion|slam-dunk contest champion/.test(key)) return 15;
      if (/rookie game participant/.test(key)) return 17;
      if (/player of the month/.test(key)) return 18;
      if (/player of the week/.test(key)) return 19;
      if (/player of the game/.test(key)) return 20;
      return 15;
    }

    function heroAwardIdentity(label) {
      const cleanLabel = stripAwardLeaguePrefix(label);
      const key = normalizeAccoladeKey(cleanLabel);
      if (/all-star game mvp/.test(key)) return { key: "all-star-game-mvp", label: "All-Star Game MVP" };
      if (/^all-star(?: appearances?)?$/.test(key)) return { key: "all-star", label: "All-Star" };
      if (isLeagueChampionship(cleanLabel)) return { key: "championship", label: "Champion" };
      return { key, label: cleanLabel };
    }

    function heroAwardLeague(label) {
      const value = cleanAccoladeLabel(label);
      const prefix = awardLeagueCodes().find((code) =>
        value.toUpperCase().startsWith(`${code} `)
      );
      if (prefix) return prefix;
      if (/champions league basketball/i.test(value)) return "CLB";
      if (/europa league basketball/i.test(value)) return "ELB";
      if (/conference league basketball/i.test(value)) return "ECL";
      return "";
    }

    function heroAwardAbbreviation(label) {
      const key = normalizeAccoladeKey(label);
      if (isLeagueChampionship(label)) return "CHAMP";
      if (/3-point shootout champion/.test(key)) return "3PT";
      if (/slam-dunk contest champion/.test(key)) return "DUNK";
      if (/rookie game mvp/.test(key)) return "RG MVP";
      if (/all-star game mvp/.test(key)) return "ASG MVP";
      if (/defensive player of the year/.test(key)) return "DPOY";
      if (/rookie of the year/.test(key)) return "ROY";
      if (/most valuable|\bmvp\b|player of the year/.test(key)) return "MVP";
      if (/all-league first/.test(key)) return "ALL-1";
      if (/all-league second/.test(key)) return "ALL-2";
      if (/all-league third/.test(key)) return "ALL-3";
      if (/all-defensive first/.test(key)) return "DEF-1";
      if (/all-defensive second/.test(key)) return "DEF-2";
      if (/all-rookie first/.test(key)) return "ROOK-1";
      if (/all-rookie second/.test(key)) return "ROOK-2";
      if (/all-star/.test(key)) return "AS";
      if (/most improved player/.test(key)) return "MIP";
      if (/sixth man of the year/.test(key)) return "6MOY";
      if (/rookie game participant/.test(key)) return "RG";
      if (/scoring leader/.test(key)) return "PTS";
      if (/assists leader/.test(key)) return "AST";
      if (/rebounds leader/.test(key)) return "REB";
      if (/steals leader/.test(key)) return "STL";
      if (/blocks leader/.test(key)) return "BLK";
      if (/player of the month/.test(key)) return "POTM";
      if (/player of the week/.test(key)) return "POTW";
      if (/player of the game/.test(key)) return "POTG";
      return clean(label).split(/\s+/).map((word) => word[0] || "").join("").slice(0, 6).toUpperCase();
    }

    function renderHeroAwards() {
      const root = document.getElementById("heroAwards");
      if (!root) return;
      const rows = Array.isArray(state.current && state.current.awards) ? state.current.awards : [];
      const honors = new Map();

      rows.forEach((item) => {
        const season = clean(item && item.season);
        let label = cleanAccoladeLabel(item && (item.label || item.award || item.name || item));
        if (!label) return;
        const league = heroAwardLeague(item && (item.award || item.name || item.label || item));
        let count = Number(item && item.count) || 0;
        if (season.toLowerCase() === "total" || item.isTotal) {
          const total = parseAccoladeTotal(item.award || label);
          label = total.label || label;
          count = Number(total.count || count || 1);
        } else {
          label = stripAwardLeaguePrefix(label);
          count = 1;
        }
        const identity = heroAwardIdentity(label);
        const current = honors.get(identity.key);
        if (!current) {
          honors.set(identity.key, { label: identity.label, count, isTotal: season.toLowerCase() === "total" || Boolean(item.isTotal), leagues: new Set(league ? [league] : []) });
        } else if (season.toLowerCase() === "total" || item.isTotal) {
          current.label = identity.label;
          current.count = Math.max(current.count, count);
          current.isTotal = true;
        } else if (!current.isTotal) {
          current.count += 1;
        }
        if (current && league) current.leagues.add(league);
      });

      const rankedHonors = Array.from(honors.values())
        .sort((a, b) => heroAwardPriority(a.label) - heroAwardPriority(b.label) || b.count - a.count || a.label.localeCompare(b.label));
      const highlights = rankedHonors.slice(0, 5);
      const remainingHonors = rankedHonors.slice(5);
      const remainingCount = remainingHonors.length;

      root.hidden = highlights.length === 0;
      root.classList.toggle("has-more", remainingCount > 0);
      const badgeHtml = rankedHonors.map((item, index) => {
        const kind = heroAwardKind(item.label);
        const countLabel = item.count > 1 ? `${item.count}×` : "";
        const abbreviation = heroAwardAbbreviation(item.label);
        const leagues = Array.from(item.leagues || []).sort().join("/");
        const accessibleLabel = `${item.label}${leagues ? `, ${leagues}` : ""}${item.count > 1 ? `, ${item.count} times` : ""}. View full awards history`;
        const isExtra = index >= highlights.length;
        return `<a class="hero-award-badge hero-award-badge--${kind}${isExtra ? " hero-award-extra" : ""}" href="#awardsPanel" title="${escapeHtml(accessibleLabel)}" aria-label="${escapeHtml(accessibleLabel)}"${isExtra ? " hidden" : ""}>
          <span class="hero-award-art">${heroAwardIcon(kind)}</span>
          <span class="hero-award-label" aria-hidden="true"><span class="hero-award-abbr">${escapeHtml(abbreviation)}</span>${leagues ? `<span class="hero-award-league">${escapeHtml(leagues)}</span>` : ""}</span>
          ${countLabel ? `<span class="hero-award-count">${escapeHtml(countLabel)}</span>` : ""}
        </a>`;
      }).join("");
      const moreHtml = remainingCount
        ? `<button class="hero-award-more" type="button" title="Show ${remainingCount} more award type${remainingCount === 1 ? "" : "s"}" aria-label="Show ${remainingCount} more award type${remainingCount === 1 ? "" : "s"}" aria-expanded="false">+${remainingCount}</button>`
        : "";
      root.innerHTML = `${badgeHtml}${moreHtml}`;

      const moreButton = root.querySelector(".hero-award-more");
      if (moreButton) {
        moreButton.onclick = () => {
          const expanded = root.classList.toggle("is-expanded");
          root.querySelectorAll(".hero-award-extra").forEach((badge) => { badge.hidden = !expanded; });
          moreButton.textContent = expanded ? "−" : `+${remainingCount}`;
          moreButton.title = expanded ? "Show fewer awards" : `Show ${remainingCount} more award type${remainingCount === 1 ? "" : "s"}`;
          moreButton.setAttribute("aria-label", moreButton.title);
          moreButton.setAttribute("aria-expanded", String(expanded));
        };
      }
    }

    function parseAccoladeTotal(label) {
      const match = String(label || "").match(/^(.*?):\s*(\d+)$/);
      return {
        label: cleanAccoladeLabel(match ? match[1] : label),
        count: match ? Number(match[2]) : ""
      };
    }

    function normalizeAccoladeKey(label) {
      return cleanAccoladeLabel(label)
        .toLowerCase()
        .replace(/\b1st\b/g, "first")
        .replace(/\b2nd\b/g, "second")
        .replace(/\ball-defense\b/g, "all-defensive")
        .replace(/\s+/g, " ");
    }

    function accoladeDetail(item) {
      let season = clean(item && item.season);
      let award = cleanAccoladeLabel(item && (item.award || item.name || item.label || item));
      let tier = "";
      const awardTier = String(award.match(/^(CLB|ELB|ECL)\s+/i)?.[1] || "").toUpperCase();
      if (awardTier) {
        tier = awardTier;
        award = award.replace(/^(CLB|ELB|ECL)\s+/i, "").trim();
      }
      const context = tier || (/^\d{4}$/.test(season) ? "" : season);
      const period = /^\d{4}$/.test(season) ? season : "";
      return { context, period, tier, award };
    }

    function renderAwardsAccolades() {
      const root = document.getElementById("awardsAccolades");
      const note = document.getElementById("awardsNote");
      const rows = Array.isArray(state.current && state.current.awards) ? state.current.awards : [];
      const totals = new Map();
      const grouped = new Map();

      rows.forEach((item) => {
        const season = clean(item && item.season);
        const award = cleanAccoladeLabel(item && (item.award || item.name || item.label || item));
        if (!award) return;
        if (season.toLowerCase() === "total" || item.isTotal) {
          const total = parseAccoladeTotal(award);
          if (!total.label) return;
          totals.set(total.label, Math.max(Number(totals.get(total.label) || 0), Number(total.count || 0)));
          return;
        }

        const detail = accoladeDetail(item);
        if (!detail.award) return;
        const groupKey = detail.period || season || "Career";
        if (!grouped.has(groupKey)) grouped.set(groupKey, []);
        grouped.get(groupKey).push(detail);
      });

      const totalItems = Array.from(totals.entries())
        .sort((a, b) => Number(b[1]) - Number(a[1]) || a[0].localeCompare(b[0]));
      const totalHtml = totalItems.length
        ? `<div class="accolade-total-grid">${totalItems.map(([label, count]) =>
            `<div class="accolade-total"><strong>${escapeHtml(count)}</strong><span>${escapeHtml(label)}</span></div>`
          ).join("")}</div>`
        : "";

      const groupSort = (key) => /^\d{4}$/.test(key) ? Number(key) : Number.MAX_SAFE_INTEGER;
      const seasonHtml = Array.from(grouped.entries())
        .sort((a, b) => groupSort(a[0]) - groupSort(b[0]) || String(a[0]).localeCompare(String(b[0])))
        .map(([groupKey, groupRows]) => {
          const unique = new Map();
          groupRows.forEach((row) => {
            const key = `${row.tier}|${normalizeAccoladeKey(row.award)}`;
            const existing = unique.get(key);
            if (!existing) {
              unique.set(key, row);
            } else if (!existing.context && row.context) {
              existing.context = row.context;
            }
          });
          const uniqueRows = Array.from(unique.values());
          return `<article class="accolade-season">
            <h3>${escapeHtml(groupKey)}</h3>
            <div class="accolade-list">
              ${uniqueRows.map((row) => `<div class="accolade-item"><span>${escapeHtml(row.context || row.tier || "SWBA")}</span><div><strong>${escapeHtml(row.award)}</strong></div></div>`).join("")}
            </div>
          </article>`;
        }).join("");

      if (note) {
        note.textContent = rows.length ? `${rows.length} record${rows.length === 1 ? "" : "s"}` : "No honors";
      }
      if (!root) return;
      root.innerHTML = totalHtml || seasonHtml
        ? `${totalHtml}${seasonHtml ? `<div class="accolade-season-grid">${seasonHtml}</div>` : ""}`
        : `<div class="empty ui-state">No awards or achievements</div>`;
    }

    function renderAwardsAndTransactions() {
      const player = state.current || {};
      renderAwardsAccolades();
      renderTwoColumnHistoryTable(
        "transactionsTable",
        "transactionsNote",
        player.transactions,
        [{ key: "date", label: "Date" }, { key: "action", label: "Action" }],
        "No transactions"
      );
    }

    function renderCareerTimeline() {
      const root = document.getElementById("careerTimeline");
      const note = document.getElementById("timelineNote");
      const stats = state.currentStats && state.currentStats.stats;
      const awardPriority = (label) => {
        const text = clean(label).toLowerCase();
        if (text.includes("most valuable player") || text.includes("mvp")) return 0;
        if (text.includes("all-league first team")) return 1;
        if (text.includes("all-defensive first team")) return 2;
        if (text.includes("rookie of the year")) return 3;
        if (text.includes("all-rookie first team")) return 4;
        if (text.includes("all-star")) return 5;
        if (text.includes("champion")) return 6;
        return 9;
      };
      const roleLabel = (row) => {
        const pts = num(row.pts) || 0;
        const reb = totalRebounds(row) || 0;
        const ast = num(row.ast) || 0;
        const stl = num(row.stl) || 0;
        const blk = num(row.blk) || 0;
        const min = num(row.min) || 0;
        const games = num(row.g) || 0;
        const starts = num(row.gs) || 0;
        const pra = pts + reb + ast;
        const stocks = stl + blk;
        if (pts >= 25 || pra >= 38) return "Superstar Season";
        if (pts >= 20 || pra >= 32) return "All-Star Level";
        if (ast >= 7) return "Lead Playmaker";
        if (pts >= 18 && ast < 6) return "Primary Scorer";
        if (pts >= 10 && stocks >= 2) return "Two-Way Starter";
        if (blk >= 1.5) return "Rim Protector";
        if (reb >= 8) return "Glass Cleaner";
        if (stl >= 1.5) return "Defensive Specialist";
        if (min >= 24 || (games > 0 && starts / games >= 0.5)) return "Starter";
        if (min >= 14) return "Rotation Player";
        return "Bench Depth";
      };
      const rows = stats && stats.season_averages && Array.isArray(stats.season_averages.rows)
        ? stats.season_averages.rows
        : [];
      const seasons = rows
        .filter((row) => Number.isFinite(Number(row.season)))
        .sort((a, b) => Number(a.season) - Number(b.season));
      const awardsBySeason = new Map();
      (Array.isArray(state.current && state.current.awards) ? state.current.awards : []).forEach((award) => {
        const season = clean(award && award.season);
        const label = clean(award && (award.award || award.name || award.label || award));
        if (!season || !label || season === "Total") return;
        if (!awardsBySeason.has(season)) awardsBySeason.set(season, []);
        awardsBySeason.get(season).push(label);
      });
      if (note) {
        note.textContent = seasons.length ? `${seasons.length} season${seasons.length === 1 ? "" : "s"}` : "No season path";
      }
      if (!root) return;
      if (!seasons.length) {
        root.innerHTML = `<div class="empty ui-state">No season timeline data</div>`;
        return;
      }
      root.innerHTML = seasons.map((row) => {
        const season = clean(row.season);
        const awards = [...new Set(awardsBySeason.get(season) || [])]
          .sort((a, b) => awardPriority(a) - awardPriority(b) || clean(a).localeCompare(clean(b)));
        const title = awards.length ? awards.join(", ") : roleLabel(row);
        const meta = [
          row.lge,
          row.team || state.current.teamLabel || state.current.team,
          `${fmt(row.pts)} PTS`,
          `${fmt(totalRebounds(row))} REB`,
          `${fmt(row.ast)} AST`
        ].filter(Boolean).join(" | ");
        return `<div class="timeline-item"><div class="timeline-season">${escapeHtml(season)}</div><div><div class="timeline-title">${escapeHtml(title)}</div><div class="timeline-meta">${escapeHtml(meta)}</div></div></div>`;
      }).join("");
    }

    function renderTabs() {
      const root = document.getElementById("statsTabs");
      const stats = state.currentStats && state.currentStats.stats ? state.currentStats.stats : {};
      const tabs = STAT_TABS.filter((tab) => stats[tab.id]);
      if (!tabs.some((tab) => tab.id === state.activeTab)) {
        state.activeTab = tabs[0] ? tabs[0].id : "season_averages";
      }
      root.innerHTML = tabs.map((tab) =>
        `<button type="button" class="tab-btn ui-tab${tab.id === state.activeTab ? " active" : ""}" data-tab="${tab.id}" aria-selected="${tab.id === state.activeTab}">${tab.label}</button>`
      ).join("");
      root.querySelectorAll(".tab-btn").forEach((btn) => btn.addEventListener("click", () => {
        state.activeTab = btn.dataset.tab;
        renderTabs();
        renderTable();
      }));
    }

    function parseSortableValue(text) {
      const raw = String(text || "").trim();
      if (!raw || raw === "--") return { type: "empty", value: Number.NEGATIVE_INFINITY };
      const cleaned = raw.replace(/[$,%]/g, "").replace(/,/g, "").replace(/[^\d.+-]/g, "");
      const n = Number(cleaned);
      if (Number.isFinite(n) && cleaned !== "") return { type: "number", value: n };
      return { type: "text", value: raw.toLowerCase() };
    }

    function makeTableSortable(table) {
      table.querySelectorAll("th").forEach((th, index) => {
        th.addEventListener("click", () => {
          const tbody = table.querySelector("tbody");
          const rows = Array.from(tbody.querySelectorAll("tr"));
          const dir = th.dataset.sortDir === "asc" ? "desc" : "asc";
          table.querySelectorAll("th").forEach((h) => h.removeAttribute("data-sort-dir"));
          th.dataset.sortDir = dir;
          rows.sort((a, b) => {
            const av = parseSortableValue((a.children[index] || {}).textContent);
            const bv = parseSortableValue((b.children[index] || {}).textContent);
            if (av.type === "number" && bv.type === "number") {
              return dir === "asc" ? av.value - bv.value : bv.value - av.value;
            }
            const cmp = String(av.value).localeCompare(String(bv.value), undefined, { numeric: true, sensitivity: "base" });
            return dir === "asc" ? cmp : -cmp;
          });
          rows.forEach((row) => tbody.appendChild(row));
        });
      });
    }

    function setParentFluidContent(enabled) {
      try {
        if (!window.parent || window.parent === window || !window.parent.document?.body) return;
        const parentDocument = window.parent.document;
        const frame = window.frameElement;
        const content = frame?.closest?.(".site-content");
        const shell = frame?.closest?.(".site-shell");

        parentDocument.body.classList.toggle("league-fluid-content", Boolean(enabled));

        if (enabled) {
          parentViewportMeta = parentDocument.querySelector('meta[name="viewport"]');
          if (!parentViewportMeta) {
            parentViewportMeta = parentDocument.createElement("meta");
            parentViewportMeta.name = "viewport";
            parentDocument.head.appendChild(parentViewportMeta);
          }
          if (parentViewportPrevious === null) {
            parentViewportPrevious = parentViewportMeta.getAttribute("content") || "";
          }
          parentViewportMeta.setAttribute("content", PLAYER_VIEWPORT);
        } else if (parentViewportMeta && parentViewportPrevious !== null) {
          parentViewportMeta.setAttribute("content", parentViewportPrevious);
          parentViewportPrevious = null;
          parentViewportMeta = null;
        }

        if (frame) {
          frame.style.minWidth = enabled ? "0" : "";
          frame.style.width = enabled ? "100%" : "";
          frame.style.maxWidth = enabled ? "100%" : "";
        }
        if (content) {
          content.style.minWidth = enabled ? "0" : "";
          content.style.overflowX = enabled ? "hidden" : "";
        }
        if (shell) {
          shell.style.minWidth = enabled ? "0" : "";
          shell.style.width = enabled ? "100vw" : "";
        }
      } catch (error) {
        // Ignore cross-frame access failures; direct page loads do not need parent sizing.
      }
    }

    async function init() {
      try {
        setParentFluidContent(true);
        const [playersRes, playerStatsRes, injuriesRes, standingsRes] = await Promise.all([
          fetch(DATA_URLS.players),
          fetch(DATA_URLS.playerStats),
          fetch(DATA_URLS.injuries),
          fetch(DATA_URLS.standings)
        ]);
        if (!playersRes.ok || !playerStatsRes.ok || !injuriesRes.ok || !standingsRes.ok) {
          throw new Error("Could not load player feeds");
        }
        const [playersData, playerStatsData, injuriesData, standingsData] = await Promise.all([
          playersRes.json(),
          playerStatsRes.json(),
          injuriesRes.json(),
          standingsRes.json()
        ]);
        let playerGamelogsData = { players: [] };
        try {
          const playerGamelogsRes = await fetch(DATA_URLS.playerGamelogs);
          if (playerGamelogsRes.ok) {
            playerGamelogsData = await playerGamelogsRes.json();
          }
        } catch (error) {
          playerGamelogsData = { players: [] };
        }
        let playerHistoryData = null;
        try {
          const playerHistoryUrl = `${DATA_URLS.playerHistory}?v=${Date.now()}`;
          const playerHistoryRes = await fetch(playerHistoryUrl, { cache: "no-store" });
          if (playerHistoryRes.ok) {
            playerHistoryData = await playerHistoryRes.json();
          }
        } catch (error) {
          playerHistoryData = null;
        }
        let playerPhotosData = { players: {} };
        try {
          const playerPhotosRes = await fetch(DATA_URLS.playerPhotos);
          if (playerPhotosRes.ok) {
            playerPhotosData = await playerPhotosRes.json();
          }
        } catch (error) {
          playerPhotosData = { players: {} };
        }
        let youthIntakeData = { teams: [] };
        try {
          const youthIntakeRes = await fetch(DATA_URLS.youthIntake);
          if (youthIntakeRes.ok) {
            youthIntakeData = await youthIntakeRes.json();
          }
        } catch (error) {
          youthIntakeData = { teams: [] };
        }
        let regularCampOverridesData = { careerLimit: 3, byPlayerId: {}, byName: {} };
        try {
          const regularCampOverridesRes = await fetch(`${DATA_URLS.regularCampOverrides}?v=${Date.now()}`, { cache: "no-store" });
          if (regularCampOverridesRes.ok) {
            regularCampOverridesData = await regularCampOverridesRes.json();
          }
        } catch (error) {
          regularCampOverridesData = { careerLimit: 3, byPlayerId: {}, byName: {} };
        }
        let campTrackerData = { careerLimits: { regular: 3 }, players: {}, issues: [] };
        try {
          const campTrackerRes = await fetch(`${DATA_URLS.campTracker}?v=${Date.now()}`, { cache: "no-store" });
          if (campTrackerRes.ok) {
            campTrackerData = await campTrackerRes.json();
          }
        } catch (error) {
          campTrackerData = { careerLimits: { regular: 3 }, players: {}, issues: [] };
        }
        state.players = Array.isArray(playersData) ? playersData : [];
        state.playerStats = Array.isArray(playerStatsData.players) ? playerStatsData.players : [];
        state.playerGamelogs = Array.isArray(playerGamelogsData.players) ? playerGamelogsData.players : [];
        state.injuries = Array.isArray(injuriesData.injuries) ? injuriesData.injuries : [];
        state.standings = Array.isArray(standingsData.sections) ? standingsData.sections : [];
        state.playerHistory = playerHistoryData;
        state.playerPhotos = playerPhotosData?.players || {};
        state.youthIntake = Array.isArray(youthIntakeData.teams) ? youthIntakeData.teams : [];
        state.campTracker = campTrackerData && typeof campTrackerData === "object"
          ? campTrackerData
          : { careerLimits: { regular: 3 }, players: {}, issues: [] };
        state.regularCampOverrides = regularCampOverridesData && typeof regularCampOverridesData === "object"
          ? regularCampOverridesData
          : { careerLimit: 3, byPlayerId: {}, byName: {} };
        state.teamDirectory = window.UnifiedRosterDataService.buildTeamDirectory(state.standings);
        state.current = findCurrentPlayer();
        if (!state.current) throw new Error("No player found");
        state.currentStats = findStatsFor(state.current);
        renderPicker();
        renderHero();
        renderPlayerDetails();
        renderTabs();
        renderTable();
        renderGameLogs();
        renderAnalystReport();
        renderAwardsAndTransactions();
        renderCareerTimeline();
      } catch (error) {
        const openedDirectly = window.location.protocol === "file:";
        document.getElementById("playerName").textContent = openedDirectly
          ? "Preview server required"
          : "Unified player unavailable";
        document.getElementById("playerMeta").textContent = openedDirectly
          ? "Use Preview Website in League Site Builder so player data can load."
          : "Could not load required player data.";
      }
    }

    window.addEventListener("pagehide", () => setParentFluidContent(false));
    window.addEventListener("beforeunload", () => setParentFluidContent(false));
    init();
  </script>
