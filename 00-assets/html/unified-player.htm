<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unified Player</title>
  <script src="../js/theme-preload.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/unified-components.css">
  <script src="../js/unified-ui.js"></script>
  <script src="../js/site-config.js"></script>
  <script src="../js/core.js" defer></script>
  <script src="../js/settings.js" defer></script>
  <style>
    :root {
      --team-color: var(--ui-navy);
      --team-color-2: var(--ui-blue);
      --ui-team: var(--team-color);
      --ui-team-secondary: var(--team-color-2);
      --ink: var(--ui-ink);
      --muted: var(--ui-muted);
      --paper: var(--ui-paper);
      --card: var(--ui-card);
      --line: var(--ui-line);
      --soft: var(--ui-soft);
      --good: var(--ui-good);
      --warn: var(--ui-warn);
      --bad: var(--ui-bad);
      --font-sans: var(--ui-font);
    }
    * { box-sizing: border-box; }
    html {
      max-width: 100vw;
      overflow-x: hidden;
    }
    body {
      margin: 0;
      padding: 0.85rem;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      max-width: 100vw;
      overflow-x: hidden;
    }
    a { color: #1d4ed8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell {
      width: 100%;
      max-width: min(1280px, calc(100vw - 1.7rem));
      display: grid;
      gap: 0.75rem;
      min-width: 0;
      overflow: hidden;
    }
    .layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 0.75rem;
      align-items: start;
      min-width: 0;
      width: 100%;
    }
    .nav-actions {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .btn-link {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 0.32rem 0.48rem;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
    }
    .btn-link:hover { border-color: var(--team-color); text-decoration: none; }
    .player-header {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr) auto;
      gap: 0.8rem;
      align-items: center;
      border: 1px solid var(--line);
      border-left: 6px solid var(--team-color);
      background: var(--card);
      padding: 0.7rem;
    }
    .header-side {
      display: grid;
      gap: 0.55rem;
      justify-items: end;
      min-width: 0;
    }
    .player-header-actions .btn-link {
      min-height: 26px;
      padding: 0.24rem 0.42rem;
      font-size: 0.7rem;
    }
    .logo,
    .logo-fallback,
    .player-portrait {
      width: 64px;
      height: 64px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--soft);
    }
    .logo { object-fit: cover; }
    .player-portrait {
      width: 72px;
      height: 96px;
      object-fit: cover;
      object-position: center top;
      background: var(--soft);
    }
    .player-identity-art {
      position: relative;
      width: 72px;
      height: 96px;
    }
    .player-team-badge-link {
      position: absolute;
      right: -7px;
      bottom: -5px;
      width: 32px;
      height: 32px;
      border: 2px solid #fff;
      outline: 1px solid var(--line);
      border-radius: 3px;
      background: #fff;
      display: block;
    }
    .player-team-badge {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .player-team-badge-link:hover,
    .player-team-badge-link:focus-visible,
    .team-logo-link:hover,
    .team-logo-link:focus-visible {
      outline: 2px solid var(--team-color);
      outline-offset: 2px;
    }
    .team-logo-link {
      display: inline-block;
      line-height: 0;
    }
    .logo-fallback {
      display: grid;
      place-items: center;
      color: var(--team-color);
      font-weight: 900;
      font-size: 1rem;
    }
    .player-title {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .player-name {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.15rem);
      line-height: 1.02;
      letter-spacing: 0;
    }
    .meta-line {
      margin-top: 0.3rem;
      color: var(--muted);
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
      line-height: 1.35;
    }
    .player-meta-link {
      color: var(--team-color);
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .tag-row,
    .skill-row {
      display: flex;
      gap: 0.28rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .tag-row { margin-top: 0.42rem; }
    .hero-awards {
      position: relative;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: repeat(5, max-content);
      grid-auto-rows: 31px;
      gap: 0.28rem;
      align-items: center;
      justify-content: flex-end;
    }
    .hero-awards.has-more { padding-right: 32px; }
    .hero-award-more {
      position: absolute;
      top: 50%;
      right: 0;
      width: 27px;
      height: 31px;
      padding: 0;
      border: 1px solid var(--line);
      border-bottom: 3px solid var(--team-color);
      border-radius: 3px;
      background: var(--soft);
      color: var(--team-color);
      display: grid;
      place-items: center;
      font-size: 0.62rem;
      font-family: inherit;
      font-weight: 950;
      cursor: pointer;
      text-decoration: none;
      transform: translateY(-50%);
    }
    .hero-award-more:hover,
    .hero-award-more:focus-visible {
      border-color: var(--team-color);
      outline: 1px solid var(--team-color);
      outline-offset: 1px;
      text-decoration: none;
    }
    .hero-awards.is-expanded .hero-award-more {
      top: 0;
      transform: none;
    }
    .hero-award-extra[hidden] { display: none; }
    .hero-award-badge {
      --award-color: #a96f08;
      position: relative;
      height: 31px;
      min-width: 42px;
      padding: 0 0.38rem 0 0.25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.22rem;
      border: 1px solid var(--line);
      border-bottom: 3px solid var(--award-color);
      border-radius: 3px;
      background: #fff;
      color: var(--ink);
      text-decoration: none;
    }
    .hero-award-badge:hover {
      border-color: var(--award-color);
      text-decoration: none;
    }
    .hero-award-badge--championship { --award-color: #a96f08; }
    .hero-award-badge--mvp { --award-color: #b43a32; }
    .hero-award-badge--defense { --award-color: #286a58; }
    .hero-award-badge--league { --award-color: var(--team-color); }
    .hero-award-art {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      color: var(--award-color);
    }
    .hero-award-art svg { width: 18px; height: 18px; display: block; }
    .hero-award-abbr {
      color: var(--ink);
      font-size: 0.61rem;
      font-weight: 950;
      letter-spacing: 0.055em;
      line-height: 1;
      white-space: nowrap;
    }
    .hero-award-label {
      display: grid;
      gap: 0.08rem;
      line-height: 1;
    }
    .hero-award-league {
      color: var(--award-color);
      font-size: 0.46rem;
      font-weight: 950;
      letter-spacing: 0.09em;
      white-space: nowrap;
    }
    .hero-award-count {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 15px;
      height: 15px;
      padding: 0 3px;
      border: 1px solid #fff;
      border-radius: 8px;
      background: var(--award-color);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 0.54rem;
      font-weight: 950;
      line-height: 1;
    }
    .rating-chip,
    .skill-chip,
    .info-chip {
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0.18rem 0.38rem;
      font-size: 0.72rem;
      font-weight: 800;
      white-space: nowrap;
    }
    .rating-chip.primary {
      background: var(--team-color);
      border-color: var(--team-color);
      color: #fff;
      font-size: 0.82rem;
    }
    .rating-chip.rating-purple { background: #7e22ce; border-color: #7e22ce; color: #fff; }
    .rating-chip.rating-blue { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
    .rating-chip.rating-green { background: #15803d; border-color: #15803d; color: #fff; }
    .rating-chip.rating-yellow { background: #facc15; border-color: #eab308; color: #1f2937; }
    .rating-chip.rating-orange { background: #f97316; border-color: #ea580c; color: #fff; }
    .rating-chip.good { color: var(--good); }
    .rating-chip.warn { color: var(--warn); }
    .intake-team-chip {
      border-color: color-mix(in srgb, var(--team-color) 42%, var(--line));
      background: color-mix(in srgb, var(--team-color) 9%, #fff);
      color: var(--team-color);
      text-decoration: none;
      letter-spacing: 0.025em;
    }
    .intake-team-chip:hover,
    .intake-team-chip:focus-visible {
      border-color: var(--team-color);
      background: color-mix(in srgb, var(--team-color) 15%, #fff);
    }
    .regular-camp-chip {
      border-color: #d49a24;
      background: #fff8e5;
      color: #75500a;
      cursor: help;
      letter-spacing: 0.015em;
      min-height: 20px;
      padding: 0.1rem 0.3rem;
      font-size: 0.65rem;
    }
    .regular-camp-chip--missing,
    .regular-camp-chip--invalid {
      border-style: dashed;
      background: #fffaf0;
      color: #8a5b00;
    }
    .regular-camp-chip--tracked {
      border-color: var(--line);
      background: var(--soft);
      color: var(--ink);
    }
    .regular-camp-chip--max {
      border-color: #b42318;
      background: #fff1f0;
      color: #9f1d14;
    }
    .regular-camp-warning {
      margin-left: 0.22rem;
      font-size: 0.68rem;
      line-height: 1;
    }
    .injury-chip {
      background: #fff1f0;
      border-color: #ffc9c4;
      color: var(--bad);
    }
    .skill-chip {
      min-width: 26px;
      justify-content: center;
      background: #fff;
      color: var(--team-color);
    }
    .header-statline {
      display: grid;
      grid-template-columns: repeat(6, 54px);
      gap: 0.35rem;
    }
    .head-stat {
      border-left: 1px solid var(--line);
      padding-left: 0.45rem;
      text-align: right;
    }
    .head-stat-value {
      display: block;
      font-size: 1.25rem;
      font-weight: 900;
      line-height: 1;
      color: var(--team-color);
    }
    .head-stat-label {
      display: block;
      margin-top: 0.12rem;
      color: var(--muted);
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .layout-ratings {
      grid-column: 1 / -1;
      width: 100%;
      min-width: 0;
    }
    .layout-left {
      align-self: start;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      grid-column: 1;
      grid-row: 2;
      min-width: 0;
    }
    .layout-sidebar {
      min-width: 0;
    }
    .layout-stats {
      grid-column: 2;
      grid-row: 2;
      align-self: start;
      min-width: 0;
    }
    .panel {
      border: 1px solid var(--line);
      background: var(--card);
      min-width: 0;
    }
    .panel + .panel { margin-top: 0.75rem; }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      padding: 0.48rem 0.6rem;
    }
    .panel-title {
      margin: 0;
      color: var(--ink);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .note {
      color: var(--muted);
      font-size: 0.72rem;
    }
    .contract-table,
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }
    .contract-table th,
    .contract-table td {
      border-bottom: 1px solid var(--line);
      padding: 0.4rem 0.55rem;
      font-size: 0.84rem;
      vertical-align: middle;
    }
    .contract-table th {
      color: var(--muted);
      font-size: 0.64rem;
      letter-spacing: 0.12em;
      text-align: left;
      text-transform: uppercase;
    }
    .contract-table td {
      text-align: right;
      font-weight: 800;
    }
    .ratings-board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0;
      width: 100%;
    }
    .rating-category {
      border-right: 1px solid var(--line);
      min-width: 0;
    }
    .rating-category:last-child { border-right: 0; }
    .rating-category-title {
      margin: 0;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      color: var(--muted);
      padding: 0.42rem 0.55rem;
      font-size: 0.64rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .rating-category-summary {
      align-items: center;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      list-style: none;
      user-select: none;
    }
    .rating-category-summary::-webkit-details-marker {
      display: none;
    }
    .rating-category-summary::after {
      color: var(--team-color);
      content: "+";
      font-size: 0.9rem;
      font-weight: 900;
      line-height: 1;
      margin-left: 0.5rem;
    }
    .rating-category[open] .rating-category-summary::after {
      content: "-";
    }
    .rating-personality-drawer {
      border-top: 1px solid var(--line);
      grid-column: 1 / -1;
      min-width: 0;
    }
    .rating-personality-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .rating-personality-grid .rating-row {
      border-right: 1px solid var(--line);
    }
    .rating-personality-grid .rating-row:last-child {
      border-right: 0;
    }
    .rating-row {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) minmax(2rem, auto) minmax(2rem, auto);
      gap: 0.4rem;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 0.36rem 0.55rem;
      font-size: 0.8rem;
    }
    .rating-row:last-child { border-bottom: 0; }
    .rating-key {
      color: var(--muted);
      font-size: 0.64rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .rating-value {
      text-align: right;
      font-weight: 900;
    }
    .potential-grade {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--team-color);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 0 0.2rem;
      font-size: 0.72rem;
      font-weight: 900;
    }
    .potential-grade.no-grade {
      color: var(--muted);
      background: #f8fafc;
    }
    .rating-row-profile .potential-grade {
      visibility: hidden;
    }
    .rating-bar {
      height: 8px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }
    .rating-fill {
      display: block;
      height: 100%;
      width: 0;
      background: var(--team-color);
    }
    .stats-panel {
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    .stats-panel .gamelog-panel,
    .stats-panel .history-panel {
      border: 0;
      background: transparent;
      margin: 0;
      min-width: 0;
    }
    .stats-panel .gamelog-panel .panel-head,
    .stats-panel .history-panel .panel-head {
      border-top: 1px solid var(--line);
    }
    .stats-panel .panel-head {
      min-width: 0;
      overflow: hidden;
    }
    .tabs {
      display: flex;
      flex-wrap: nowrap;
      flex: 1 1 auto;
      gap: 0.3rem;
      max-width: 100%;
      min-width: 0;
      overflow-x: auto;
      padding-bottom: 0.05rem;
    }
    .tab-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      flex: 0 0 auto;
      font: inherit;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.32rem 0.45rem;
    }
    .tab-btn.active {
      background: var(--team-color);
      border-color: var(--team-color);
      color: #fff;
    }
    .table-wrap {
      display: block;
      overflow: auto;
      width: 100%;
      max-width: 100%;
      max-height: min(62vh, 620px);
      position: relative;
      border-bottom: 1px solid var(--line);
      scrollbar-gutter: stable;
    }
    .data-table {
      border-collapse: separate;
      border-spacing: 0;
      min-width: 980px;
      overflow: visible;
      table-layout: auto;
      width: max-content !important;
      max-width: none !important;
    }
    .data-table th,
    .data-table td {
      border-bottom: 1px solid var(--line);
      padding: 0.38rem 0.44rem;
      text-align: right;
      white-space: nowrap;
      font-size: 0.82rem;
    }
    .data-table th {
      position: sticky;
      top: 0;
      background: #f1f5f9;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.64rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .data-table tbody tr:nth-child(odd) td { background: #fff; }
    .data-table tbody tr:nth-child(even) td { background: #f8fafc; }
    .data-table th:first-child,
    .data-table td:first-child {
      left: 0;
      min-width: 92px;
      position: sticky;
      width: 92px;
      z-index: 6;
    }
    .data-table th:nth-child(2),
    .data-table td:nth-child(2) {
      left: 92px;
      min-width: 68px;
      position: sticky;
      width: 68px;
      z-index: 6;
    }
    .data-table th:first-child,
    .data-table th:nth-child(2) {
      z-index: 8;
    }
    .data-table.is-highs {
      min-width: 760px;
    }
    .data-table.is-highs th:first-child,
    .data-table.is-highs td:first-child {
      min-width: 138px;
      width: 138px;
    }
    .data-table.is-highs th:nth-child(2),
    .data-table.is-highs td:nth-child(2) {
      left: auto;
      min-width: 0;
      position: static;
      width: auto;
      z-index: auto;
    }
    .data-table td:first-child,
    .data-table th:first-child,
    .data-table td:nth-child(2),
    .data-table th:nth-child(2),
    .data-table td:nth-child(3),
    .data-table th:nth-child(3) {
      text-align: left;
    }
    .empty {
      padding: 0.75rem;
      color: var(--muted);
    }
    .media-mentions-body {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: min(48vh, 420px);
      overflow-y: auto;
      padding: 0.55rem 0.6rem 0.65rem;
    }
    .media-mention-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: inherit;
      display: block;
      padding: 0.45rem 0.5rem;
      text-decoration: none;
    }
    .media-mention-card:hover {
      border-color: var(--team-color);
    }
    .media-mention-title {
      font-size: 0.78rem;
      font-weight: 850;
      line-height: 1.25;
      margin: 0 0 0.2rem;
    }
    .media-mention-meta {
      color: var(--muted);
      font-size: 0.64rem;
      margin-bottom: 0.25rem;
    }
    .media-mention-blurb {
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      color: var(--ink);
      display: -webkit-box;
      font-size: 0.72rem;
      line-height: 1.35;
      overflow: hidden;
    }
    .media-mentions-all {
      color: var(--team-color);
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      margin-top: 0.1rem;
      text-decoration: none;
    }
    .media-mentions-all:hover {
      text-decoration: underline;
    }
    .analyst-report {
      display: grid;
      gap: 0.65rem;
      padding: 0.6rem;
    }
    .analyst-summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.45rem;
    }
    .analyst-summary-card {
      border: 1px solid var(--line);
      background: #fff;
      padding: 0.45rem 0.5rem;
      min-width: 0;
    }
    .analyst-label {

    const RATING_GROUPS = [
      {
        title: "Offense",
        ratings: [["Ins", "Inside"], ["Jps", "Jump Shot"], ["Fts", "Free Throw"], ["3ps", "Three"], ["Hnd", "Handle"], ["Pas", "Pass"], ["Orb", "Off Reb"]]
      },

        ]

    const STAT_TABS = [

      { id: "efficiency", label: "Efficiency" },

      { id: "playoff_shooting", label: "Playoff Shooting" },
      { id: "career_highs", label: "Highs" }
    ];

    const state = {
      players: [],
      playerStats: [],
      playerGamelogs: [],
      injuries: [],
      standings: [],
      playerPhotos: {},
      regularCampOverrides: { careerLimit: 3, byPlayerId: {}, byName: {} },
      teamDirectory: [],
      current: null,
      currentStats: null,
      activeTab: "season_averages"
    };

    let eslMediaArticlesLoad = null;

    function params() {
      return new URLSearchParams(window.location.search);
    }

    function clean(v) {
      return String(v || "").replace(/\s+/g, " ").trim();
    }

    function escapeHtml(v) {
      return String(v || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function normalizeName(v) {
      const base = clean(String(v || "")).toLowerCase();
      const folded = base.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      return folded.replace(/[^a-z0-9]/g, "");
    }

    function slugify(v) {
      return clean(v).toLowerCase().replace(/[^a-z0-9]+/g, "");
    }

    function playerIdFromUrl(url) {
      const match = String(url || "").match(/player(\d+)\.htm/i);
      return match ? `player${match[1]}` : "";
    }

    function playerFileFromUrl(url) {
      const id = playerIdFromUrl(url);
      return id ? `${id}.htm` : "";
    }

    function basketballReferenceHref(player) {
      const playerId = player?.playerId || playerIdFromUrl(player?.url);
      const sourceId = String(state.playerPhotos?.[playerId]?.sourceId || "").toLowerCase();
      if (!/^[a-z]{5,8}\d{2}$/.test(sourceId)) return "";
      return `https://www.basketball-reference.com/players/${sourceId[0]}/${sourceId}.html`;
    }

    function regularCampChip(player) {
      const overrides = state.regularCampOverrides || {};
      const tracker = state.campTracker || {};
      const configuredLimit = Number(overrides.careerLimit || tracker.careerLimits?.regular);
      const limit = Number.isInteger(configuredLimit) && configuredLimit > 0 ? configuredLimit : 3;
      const playerId = clean(player?.playerId) || playerIdFromUrl(player?.url);
      const byPlayerId = overrides.byPlayerId && typeof overrides.byPlayerId === "object" ? overrides.byPlayerId : {};
      const byName = overrides.byName && typeof overrides.byName === "object" ? overrides.byName : {};
      let record = playerId ? byPlayerId[playerId] : undefined;
      let sourceType = record === undefined ? "" : "manual";

      if (record === undefined) {
        const nameKey = normalizeName(player?.name);
        const matchingName = Object.keys(byName).find((name) => normalizeName(name) === nameKey);
        if (matchingName) {
          record = byName[matchingName];
          sourceType = "manual";
        }
      }

      if (record === undefined && playerId && tracker.players && typeof tracker.players === "object") {
        record = tracker.players[playerId];
        if (record !== undefined) sourceType = "tracker";
      }

      if (record === undefined) {
        return `<span class="info-chip regular-camp-chip regular-camp-chip--tracked" title="Career Regular Camps used: 0 of ${limit}. Players without a camp record automatically count as 0 used.">CAMP 0/${limit}</span>`;
      }

      const rawValue = record && typeof record === "object" ? record.regular : record;
      const value = Number(rawValue);
      if (!Number.isInteger(value) || value < 0 || value > limit) {
        return `<span class="info-chip regular-camp-chip regular-camp-chip--invalid" title="This player's manual Regular Camp override is invalid. Enter a whole number from 0 to ${limit}.">CAMP !/${limit}<span class="regular-camp-warning" aria-hidden="true">&#9888;</span></span>`;
      }

      const note = record && typeof record === "object" && record.note ? ` ${clean(record.note)}` : "";
      const maxed = value >= limit;
      const label = `CAMP ${value}/${limit}`;
      const isManual = sourceType === "manual";
      const maxNote = maxed ? " Career maximum reached." : "";
      const title = isManual
        ? `Manual career Regular Camp override: ${value} of ${limit} used.${maxNote}${note} Verify this count before assigning another camp.`
        : `Career Regular Camps used: ${value} of ${limit}.${maxNote} Matched to this player during the site build.`;
      return `<span class="info-chip regular-camp-chip${sourceType === "tracker" ? " regular-camp-chip--tracked" : ""}${maxed ? " regular-camp-chip--max" : ""}" title="${escapeHtml(title)}">${label}${isManual ? '<span class="regular-camp-warning" aria-hidden="true">&#9888;</span>' : ""}</span>`;
    }

    function normalizeIdentityName(value) {
      return clean(value).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    }

    function absoluteHref(href) {
      return new URL(href || window.location.href, window.location.href).href;
    }

    function copyButtonText(button, text) {
      if (!button) return;
      const original = button.dataset.originalText || button.textContent;
      button.dataset.originalText = original;
      button.textContent = text;
      window.clearTimeout(button._copyTimer);
      button._copyTimer = window.setTimeout(() => {
        button.textContent = button.dataset.originalText || original;
      }, 1400);
    }

    async function copyText(value, button) {
      const text = String(value || "");
      if (!text) return;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const input = document.createElement("textarea");
          input.value = text;
          input.setAttribute("readonly", "");
          input.style.position = "fixed";
          input.style.opacity = "0";
          document.body.appendChild(input);
          input.select();
          document.execCommand("copy");
          input.remove();
        }
        copyButtonText(button, "Copied");
      } catch (error) {
        copyButtonText(button, "Copy Failed");
      }
    }

    function initials(name) {
      return clean(name).split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part[0].toUpperCase()).join("") || "SWBA";
    }

    function num(v) {
      const n = Number(String(v || "").replace(/[$,%]/g, "").replace(/,/g, ""));
      return Number.isFinite(n) ? n : null;
    }

    function ratingWidth(v) {
      const n = num(v);
      if (n !== null) return Math.max(0, Math.min(100, n));
      const match = String(v || "").trim().toUpperCase().match(/^([SABCDF])([+-])?$/);
      const base = { S: 100, A: 95, B: 80, C: 65, D: 50, F: 35 };
      if (!match || base[match[1]] == null) return 0;
      return Math.max(0, Math.min(100, base[match[1]] + (match[2] === "+" ? 5 : match[2] === "-" ? -5 : 0)));
    }

    function fmt(value) {
      return value === undefined || value === null || value === "" ? "--" : value;
    }

    function statNumber(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function totalRebounds(row) {
      if (!row) return undefined;
      if (row.reb !== undefined && row.reb !== null && row.reb !== "") return row.reb;
      const orb = statNumber(row.orb);
      const drb = statNumber(row.drb);
      if (orb === null && drb === null) return undefined;
      return Math.round(((orb || 0) + (drb || 0)) * 10) / 10;
    }

    function ratingTierClass(value) {
      const n = num(value) || 0;
      if (n >= 151) return "rating-purple";
      if (n >= 115) return "rating-blue";
      if (n >= 100) return "rating-green";
      if (n >= 80) return "rating-yellow";
      return "rating-orange";
    }

    function findCurrentPlayer() {
      const id = clean(params().get("id"));
      const name = clean(params().get("name"));
      const sourceUrl = clean(params().get("url"));
      if (id) {
        const byId = state.players.find((p) => playerIdFromUrl(p.url).toLowerCase() === id.toLowerCase());
        if (byId) return byId;
      }
      if (sourceUrl) {
        const sourceId = playerIdFromUrl(sourceUrl);
        const byUrl = state.players.find((p) => playerIdFromUrl(p.url) === sourceId);
        if (byUrl) return byUrl;
      }
      if (name) {
        const key = normalizeName(name);
        const byName = state.players.find((p) => normalizeName(p.name) === key);
        if (byName) return byName;
      }
      return state.players[0] || null;
    }

    function findStatsFor(player) {
      const id = playerIdFromUrl(player && player.url);
      const key = normalizeName(player && player.name);
      return state.playerStats.find((p) => playerIdFromUrl(p.url) === id) ||
        state.playerStats.find((p) => normalizeName(p.name) === key) ||
        null;
    }

    function findGamelogsFor(player) {
      const id = playerIdFromUrl(player && player.url);
      const key = normalizeName(player && player.name);
      return state.playerGamelogs.find((p) => playerIdFromUrl(p.url) === id) ||
        state.playerGamelogs.find((p) => normalizeName(p.name) === key) ||
        null;
    }

    function findTeam(player) {
      const teamKey = clean(player && player.team);
      const teamLabel = clean(player && player.teamLabel);
      return state.teamDirectory.find((t) => t.teamId === teamKey || t.teamName === teamLabel) || null;
    }

    function findIntakeAssignment(player) {
      if (normalizeName(player && (player.teamLabel || player.team)) !== "draft") return null;
      const playerId = clean(player && player.playerId) || playerIdFromUrl(player && player.url);
      const nameKey = normalizeName(player && player.name);
      const nameMatches = [];
      for (const team of state.youthIntake) {
        for (const prospect of Array.isArray(team && team.intakePlayers) ? team.intakePlayers : []) {
          const prospectId = clean(prospect && prospect.playerId);
          if (playerId && prospectId && prospectId === playerId) return { team: team.team, prospect };
          if (nameKey && normalizeName(prospect && prospect.name) === nameKey) {
            nameMatches.push({ team: team.team, prospect });
          }
        }
      }
      return nameMatches.length === 1 ? nameMatches[0] : null;
    }

    function findInjury(player) {
      const nameKey = normalizeName(player && player.name);
      const teamKey = normalizeName(player && player.teamLabel);
      if (!nameKey) return null;
      if (teamKey) {
        return state.injuries.find((item) => normalizeName(item.name) === nameKey && normalizeName(item.teamName) === teamKey) || null;
      }
      return state.injuries.find((item) => normalizeName(item.name) === nameKey) || null;
    }

    function bestCurrentRow() {
      const stats = state.currentStats && state.currentStats.stats;
      const rows = stats && stats.season_averages && Array.isArray(stats.season_averages.rows) ? stats.season_averages.rows : [];
      const realRows = rows.filter((r) => String(r.season || "").toLowerCase() !== "career");
      return realRows.slice().sort((a, b) => Number(b.season) - Number(a.season))[0] || rows[0] || {};
    }

    function latestSeasonRowForStats(statsEntry) {
      const stats = statsEntry && statsEntry.stats;
      const rows = stats && stats.season_averages && Array.isArray(stats.season_averages.rows) ? stats.season_averages.rows : [];
      const realRows = rows.filter((row) => String(row.season || "").toLowerCase() !== "career");
      return realRows.slice().sort((a, b) => Number(b.season) - Number(a.season))[0] || rows[0] || null;
    }

    function ordinal(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "--";
      const mod100 = n % 100;
      const suffix = mod100 >= 11 && mod100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th");
      return `${n}${suffix}`;
    }

    function playerStatsEntry(player) {
      return findStatsFor(player);
    }

    function playerTeamName(player) {
      return normalizeName(player && (player.teamLabel || player.team));
    }

    function sameTeamPlayers(player) {
      const teamKey = playerTeamName(player);
      if (!teamKey) return [];
      return state.players.filter((item) => playerTeamName(item) === teamKey);
    }

    function teamStatRank(player, statKey) {
      const teamPlayers = sameTeamPlayers(player)
        .map((item) => {
          const row = latestSeasonRowForStats(playerStatsEntry(item));
          const value = statKey === "reb" ? num(totalRebounds(row)) : num(row && row[statKey]);
          return { player: item, value: value === null ? Number.NEGATIVE_INFINITY : value };
        })
        .filter((entry) => entry.value !== Number.NEGATIVE_INFINITY)
        .sort((a, b) => b.value - a.value || clean(a.player.name).localeCompare(clean(b.player.name)));
      const currentId = playerIdFromUrl(player && player.url);
      const index = teamPlayers.findIndex((entry) => playerIdFromUrl(entry.player.url) === currentId);
      if (index < 0) return "";
      return `${ordinal(index + 1)} team ${statKey === "reb" ? "REB" : statKey.toUpperCase()}`;
    }

    const POSITION_PROFILES = {
      PG: {
        family: "guard",
        primary: ["Hnd", "Pas", "Qkn", "Prd", "Stl", "Jps", "3ps"],
        secondary: ["Fts", "Ins", "Sta"],
        lowIgnore: ["Orb", "Drb", "Blk", "Str"]
      },
      SG: {
        family: "guard",
        primary: ["Jps", "3ps", "Hnd", "Prd", "Qkn", "Stl", "Pas"],
        secondary: ["Ins", "Fts", "Sta"],
        lowIgnore: ["Orb", "Blk", "Str"]
      },
      SF: {
        family: "wing",
        primary: ["Jps", "3ps", "Ins", "Prd", "Psd", "Qkn", "Drb", "Str"],
        secondary: ["Hnd", "Pas", "Stl", "Sta"],
        lowIgnore: ["Orb", "Blk"]
      },
      PF: {
        family: "big",
        primary: ["Ins", "Drb", "Orb", "Psd", "Blk", "Str", "Jps"],
        secondary: ["Qkn", "Sta", "Fts"],
        lowIgnore: ["3ps", "Hnd", "Pas", "Prd"]
      },
      C: {
        family: "big",
        primary: ["Ins", "Drb", "Orb", "Psd", "Blk", "Str", "Sta"],
        secondary: ["Jps", "Qkn", "Fts"],
        lowIgnore: ["3ps", "Hnd", "Pas", "Prd"]
      }
    };

    const RATING_LABELS = {
      Ins: "Inside", Jps: "Jump Shot", Fts: "Free Throw", "3ps": "Three",
      Hnd: "Handle", Pas: "Pass", Orb: "Off Reb", Drb: "Def Reb",
      Psd: "Post Def", Prd: "Per Def", Stl: "Steal", Blk: "Block",
      Qkn: "Quick", Jmp: "Jump", Str: "Strength", Sta: "Stamina"
    };

    function positionProfile(player) {
      const pos = clean(player && player.pos).toUpperCase().split(/[^A-Z]+/).filter(Boolean)[0] || "";
      return POSITION_PROFILES[pos] || POSITION_PROFILES.SF;
    }

    function ratingScore(player, keys) {
      const values = keys.map((key) => num(player && player[key])).filter((value) => value !== null);
      if (!values.length) return 0;
      return values.reduce((sum, value) => sum + value, 0) / values.length;
    }

    function playerRole(player, row) {
      const pts = num(row && row.pts) || 0;
      const ast = num(row && row.ast) || 0;
      const reb = num(totalRebounds(row)) || 0;
      const min = num(row && row.min) || 0;
      const profile = positionProfile(player);
      const get = (key) => num(player && player[key]) || 0;
      const shooting = ratingScore(player, ["Jps", "3ps", "Fts"]);
      const creation = ratingScore(player, ["Hnd", "Pas", "Qkn"]);
      const perimeterDefense = ratingScore(player, ["Prd", "Stl", "Qkn"]);
      const interiorDefense = ratingScore(player, ["Psd", "Blk", "Str"]);
      const rebounding = ratingScore(player, ["Orb", "Drb"]);
      const interiorScoring = ratingScore(player, ["Ins", "Orb", "Str"]);

      if (profile.family === "guard") {
        if (ast >= 7 || (creation >= 72 && ast >= 5)) return "Lead guard";
        if (pts >= 20 && creation >= 64) return "Shot creator";
        if (shooting >= 74 && pts >= 12) return "Floor spacer";
        if (perimeterDefense >= 72) return "Point-of-attack defender";
      } else if (profile.family === "wing") {
        if (pts >= 20 && shooting >= 68) return "Scoring wing";
        if (perimeterDefense >= 70 && shooting >= 62) return "Two-way wing";
        if (shooting >= 74) return "Floor spacer";
        if (interiorScoring >= 68 && reb >= 6) return "Slashing forward";
      } else {
        if (interiorDefense >= 72 && reb >= 7) return "Rim protector";
        if (rebounding >= 74 && reb >= 8) return "Glass cleaner";
        if (interiorScoring >= 72 && pts >= 12) return "Interior finisher";
        if (shooting >= 70 && pts >= 10) return "Stretch big";
      }

      if (pts >= 23) return "Primary scorer";
      if (min >= 24) return "Two-way rotation";
      return "Depth piece";
    }

    function squadStatus(row) {
      const min = num(row && row.min) || 0;
      const pts = num(row && row.pts) || 0;
      if (min >= 32 || pts >= 22) return "Key player";
      if (min >= 24 || pts >= 14) return "Starter level";
      if (min >= 14 || pts >= 7) return "Rotation";
      if (min > 0) return "Depth";
      return "Unproven";
    }

    function recentRows(player) {
      const record = findGamelogsFor(player);
      const section = record && record.gameLogs;
      return section && Array.isArray(section.rows) ? section.rows.slice(-5) : [];
    }

    function averageStat(rows, key) {
      const values = rows.map((row) => key === "reb" ? num(totalRebounds(row)) : num(row && row[key])).filter((value) => value !== null);
      if (!values.length) return null;
      return Math.round((values.reduce((sum, value) => sum + value, 0) / values.length) * 10) / 10;
    }

    function formLabel(player, row) {
      const rows = recentRows(player);
      if (!rows.length) return "No recent log";
      const recentPts = averageStat(rows, "pts");
      const seasonPts = num(row && row.pts);
      if (recentPts === null || seasonPts === null) return `${rows.length}-game sample`;
      const delta = Math.round((recentPts - seasonPts) * 10) / 10;
      if (delta >= 4) return `Hot, +${delta} PPG`;
      if (delta <= -4) return `Cold, ${delta} PPG`;
      return `Stable, ${recentPts} PPG L${rows.length}`;
    }

    function positionRatingItems(player, direction) {
      const profile = positionProfile(player);
      const keys = direction === "high"
        ? [...profile.primary, ...profile.secondary]
        : profile.primary.filter((key) => !profile.lowIgnore.includes(key));
      const seen = new Set();
      const ratings = keys
        .filter((key) => {
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .map((key) => ({ key, label: RATING_LABELS[key] || key, value: num(player && player[key]) }))
        .filter((item) => item.value !== null);
      return ratings
        .sort((a, b) => direction === "high" ? b.value - a.value || a.label.localeCompare(b.label) : a.value - b.value || a.label.localeCompare(b.label))
        .slice(0, 3)
        .map((item) => `${item.label} ${item.value}`);
    }

    function analystSentence(player, row, role, form, injury) {
      const teamRanks = [teamStatRank(player, "pts"), teamStatRank(player, "reb"), teamStatRank(player, "ast")].filter(Boolean).slice(0, 2);
      const availability = injury ? `${injury.injury} (${injury.length}d)` : "available";
      return `${role} profile, ${availability}. ${form}. ${teamRanks.length ? teamRanks.join(", ") + "." : "Team rank context unavailable."}`;
    }

    function renderAnalystReport() {
      const root = document.getElementById("analystReport");
      const note = document.getElementById("analystNote");
      if (!root || !state.current) return;
      const player = state.current;
      const row = bestCurrentRow();
      const injury = findInjury(player);
      const role = playerRole(player, row);
      const status = squadStatus(row);
      const form = formLabel(player, row);
      const ranks = [teamStatRank(player, "pts"), teamStatRank(player, "reb"), teamStatRank(player, "ast")].filter(Boolean);
      const strengths = positionRatingItems(player, "high");
      const concerns = positionRatingItems(player, "low");
      if (note) note.textContent = row.season ? `${row.season} profile` : "Live profile";
      root.innerHTML = [
        '<div class="analyst-summary-grid">',
        summaryCard("Role", role),
        summaryCard("Squad Status", status),
        summaryCard("Form", form),
        summaryCard("Team Rank", ranks[0] || "No rank"),
        "</div>",
        `<div class="analyst-note">${escapeHtml(analystSentence(player, row, role, form, injury))}</div>`,
        '<div class="analyst-list-grid">',
        analystList("Strengths", strengths, "analyst-list"),
        analystList("Concerns", concerns, "analyst-list analyst-list--concerns"),
        "</div>",
        renderDevelopmentTrend(player)
      ].join("");
    }

    function summaryCard(label, value) {
      return `<div class="analyst-summary-card"><span class="analyst-label">${escapeHtml(label)}</span><span class="analyst-value">${escapeHtml(value || "--")}</span></div>`;
    }

    function analystList(title, items, className) {
      const rows = (items && items.length ? items : ["No clear signal"]).map((item) => `<li>${escapeHtml(item)}</li>`).join("");
      return `<div class="${className}"><div class="analyst-list-title">${escapeHtml(title)}</div><ul>${rows}</ul></div>`;
    }

    function trendIdentityMatches(identity, player) {
      if (!identity || !player) return false;
      const playerFile = playerFileFromUrl(player.url);
      const nameKey = normalizeIdentityName(player.name);
      const height = clean(player.ht || player.height);
      const appearances = Array.isArray(identity.appearances) ? identity.appearances : [];
      const nameMatches = nameKey && normalizeIdentityName(identity.name) === nameKey;
      const heightMatches = identity.height && height && clean(identity.height) === height;
      if (nameMatches && heightMatches) return true;
      if (nameMatches && playerFile && appearances.some((row) => clean(row.playerFile).toLowerCase() === playerFile.toLowerCase())) return true;
      return false;
    }

    function seasonSortValue(label) {
      const match = String(label || "").match(/(\d+)/);
      return match ? Number(match[1]) : 9999;
    }

    function seasonLabel(label) {
      const raw = clean(label);
      const match = raw.match(/^season-(\d+)$/i);
      return match ? `S${match[1]}` : raw || "Current";
    }

    function signedDelta(value) {
      if (!Number.isFinite(value) || value === 0) return "0";
      return value > 0 ? `+${value}` : String(value);
    }

    function developmentTrendRows(player) {
      const identities = state.playerHistory && Array.isArray(state.playerHistory.identities) ? state.playerHistory.identities : [];
      const identity = identities.find((entry) => trendIdentityMatches(entry, player));
      const rows = identity && Array.isArray(identity.appearances)
        ? identity.appearances.map((row) => ({
          label: seasonLabel(row.season),
          sort: seasonSortValue(row.season),
          overall: num(row.overall),
          potential: num(row.potential)
        })).filter((row) => row.overall !== null || row.potential !== null)
        : [];
      const currentOverall = num(player && player.overall);
      const currentPotential = num(player && player.potential);
      const currentFile = playerFileFromUrl(player && player.url);
      const currentAppearance = identity && Array.isArray(identity.appearances) && currentFile
        ? identity.appearances.find((row) => clean(row.playerFile).toLowerCase() === currentFile.toLowerCase())
        : null;
      const archivedMatchesCurrent = currentAppearance
        && num(currentAppearance.overall) === currentOverall
        && num(currentAppearance.potential) === currentPotential;
      if (!archivedMatchesCurrent && (currentOverall !== null || currentPotential !== null)) {
        rows.push({ label: "Current", sort: 10000, overall: currentOverall, potential: currentPotential });
      }
      const seen = new Set();
      return rows
        .sort((a, b) => a.sort - b.sort || a.label.localeCompare(b.label))
        .filter((row) => {
          const key = `${row.label}|${row.overall}|${row.potential}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
    }

    function trendPath(rows, key, minValue, maxValue, width, height, pad) {
      const points = rows.map((row, index) => {
        const value = row[key];
        if (value === null) return null;
        const x = rows.length === 1 ? width / 2 : pad + (index * (width - pad * 2)) / (rows.length - 1);
        const range = Math.max(1, maxValue - minValue);
        const y = height - pad - ((value - minValue) / range) * (height - pad * 2);
        return { x, y, value, label: row.label };
      }).filter(Boolean);
      return points;
    }

    function renderDevelopmentTrend(player) {
      const rows = developmentTrendRows(player);
      if (rows.length < 2) return "";
      const values = rows.flatMap((row) => [row.overall, row.potential]).filter((value) => value !== null);
      if (!values.length) return "";
      const minValue = Math.max(0, Math.min(...values) - 4);
      const maxValue = Math.max(...values) + 4;
      const width = 360;
      const height = 150;
      const pad = 24;
      const ovrPoints = trendPath(rows, "overall", minValue, maxValue, width, height, pad);
      const potPoints = trendPath(rows, "potential", minValue, maxValue, width, height, pad);
      const line = (points) => points.map((point, index) => `${index ? "L" : "M"} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`).join(" ");
      const dots = (points, cls) => points.map((point) => `<circle class="trend-dot ${cls}" cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="4"><title>${escapeHtml(point.label)}: ${point.value}</title></circle>`).join("");
      const labels = rows.map((row, index) => {
        const x = rows.length === 1 ? width / 2 : pad + (index * (width - pad * 2)) / (rows.length - 1);
        return `<text class="trend-axis-label" x="${x.toFixed(1)}" y="145" text-anchor="middle">${escapeHtml(row.label)}</text>`;
      }).join("");
      const first = rows[0];
      const last = rows[rows.length - 1];
      const showRatingNumbers = !window.LeagueSiteCore || LeagueSiteCore.showRatingNumbers();
      const ovrDelta = showRatingNumbers && last.overall !== null && first.overall !== null ? signedDelta(last.overall - first.overall) : "--";
      const potDelta = showRatingNumbers && last.potential !== null && first.potential !== null ? signedDelta(last.potential - first.potential) : "--";
      return [
        '<div class="development-trend">',
        '<div class="development-trend-head">',
        '<div class="development-trend-title">Development Trend</div>',
        `<div class="development-trend-delta">OVR ${escapeHtml(ovrDelta)} | POT ${escapeHtml(potDelta)}</div>`,
        '</div>',
        `<svg class="trend-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${showRatingNumbers ? "Archived overall and potential trend" : "Archived rating colour trend"}">`,
        `<line class="trend-grid" x1="${pad}" x2="${width - pad}" y1="${pad}" y2="${pad}"></line>`,
        `<line class="trend-grid" x1="${pad}" x2="${width - pad}" y1="${height - pad}" y2="${height - pad}"></line>`,
        ovrPoints.length > 1 ? `<path class="trend-line-ovr" d="${line(ovrPoints)}"></path>` : "",
        potPoints.length > 1 ? `<path class="trend-line-pot" d="${line(potPoints)}"></path>` : "",
        dots(ovrPoints, "trend-dot-ovr"),
        dots(potPoints, "trend-dot-pot"),
        labels,
        '</svg>',
        '<div class="trend-legend"><span class="trend-key"><span class="trend-swatch"></span>OVR</span><span class="trend-key"><span class="trend-swatch trend-swatch-pot"></span>POT</span></div>',
        '</div>'

    function skillTags(player) {
      const tags = [];
      const get = (key) => num(player[key]) || 0;
      if (get("3ps") >= 70) tags.push(["3", "Three Point Shooter"]);
      if ((get("Qkn") + get("Jmp") + get("Str")) / 3 >= 70) tags.push(["A", "Athlete"]);
      if ((get("Hnd") + get("Pas")) / 2 >= 70) tags.push(["B", "Ball Handler"]);
      if ((get("Psd") + get("Blk") + get("Str")) / 3 >= 70) tags.push(["Di", "Interior Defender"]);
      if ((get("Prd") + get("Stl") + get("Qkn")) / 3 >= 70) tags.push(["Dp", "Perimeter Defender"]);
      if (get("Ins") >= 70) tags.push(["Po", "Post Scorer"]);
      if (get("Pas") >= 70) tags.push(["Ps", "Passer"]);
      if ((get("Orb") + get("Drb")) / 2 >= 70) tags.push(["R", "Rebounder"]);
      if ((get("Ins") + get("Jps") + get("3ps")) / 3 >= 70) tags.push(["V", "Volume Scorer"]);
      return tags;
    }

    function renderPicker() {
      const wrap = document.getElementById("playerSearchWrap");
      const input = document.getElementById("playerSearchInput");
      const results = document.getElementById("playerSearchResults");
      if (!wrap || !input || !results) return;
      const sorted = [...state.players]
        .filter((p) => p.name && p.url && playerIdFromUrl(p.url))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }))
        .map((player) => {
          const team = player.teamLabel || player.team || "Team";
          return {
            id: playerIdFromUrl(player.url),
            name: player.name,
            team,
            url: player.url,
            label: `${player.name} - ${team}`,
            search: normalizeName(`${player.name} ${team} ${player.pos || ""}`)
          };
        });
      let activeIndex = -1;
      let visible = [];

      function closeResults() {
        results.hidden = true;
        input.setAttribute("aria-expanded", "false");
        activeIndex = -1;
      }

      function goToPlayer(item) {
        if (!item || !item.id) return;
        const links = window.leaguePlayerPageLinks;
        if (links && links.isClassic() && item.url) {
          window.location.href = links.hrefFromAssetsHtml(item.url);
          return;
        }
        window.location.href = `./unified-player.htm?id=${encodeURIComponent(item.id)}`;
      }

      function renderResults(query) {
        const key = normalizeName(query);
        visible = sorted
          .filter((item) => !key || item.search.includes(key))
          .slice(0, 12);
        activeIndex = visible.length ? 0 : -1;
        results.innerHTML = visible.length
          ? visible.map((item, index) => (
              `<button class="player-search-option ${index === activeIndex ? "active" : ""}" type="button" role="option" data-id="${escapeHtml(item.id)}" aria-selected="${index === activeIndex ? "true" : "false"}">` +
                `<strong>${escapeHtml(item.name)}</strong><span>${escapeHtml(item.team)}</span>` +
              `</button>`
            )).join("")
          : `<button class="player-search-option" type="button" disabled><strong>No players found</strong><span>Search</span></button>`;
        results.hidden = false;
        input.setAttribute("aria-expanded", "true");
      }

      function syncActiveOption() {
        Array.from(results.querySelectorAll(".player-search-option")).forEach((button, index) => {
          const active = index === activeIndex;
          button.classList.toggle("active", active);
          button.setAttribute("aria-selected", String(active));
        });
      }

      input.value = "";
      input.placeholder = "Search players";
      input.addEventListener("focus", () => {
        input.select();
        renderResults("");
      });
      input.addEventListener("click", () => renderResults(""));
      input.addEventListener("input", () => renderResults(input.value));
      input.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown") {
          event.preventDefault();
          if (results.hidden) renderResults(input.value);
          activeIndex = Math.min(visible.length - 1, activeIndex + 1);
          syncActiveOption();
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          if (results.hidden) renderResults(input.value);
          activeIndex = Math.max(0, activeIndex - 1);
          syncActiveOption();
        } else if (event.key === "Enter") {
          event.preventDefault();
          if (results.hidden) renderResults(input.value);
          goToPlayer(visible[activeIndex] || visible[0]);
        } else if (event.key === "Escape") {
          closeResults();
          input.blur();
        }
      });
      results.addEventListener("mousedown", (event) => event.preventDefault());
      results.addEventListener("click", (event) => {
        const option = event.target.closest(".player-search-option[data-id]");
        if (!option) return;
        goToPlayer(sorted.find((item) => item.id === option.dataset.id));
      });
      document.addEventListener("click", (event) => {
        if (!wrap.contains(event.target)) closeResults();
      });
    }

    function keyFromHeader(header, used) {
      const base = String(header || "")
        .toLowerCase()
        .replace("%", "_pct")
        .replace("+/-", "plus_minus")
        .replace("a/t", "a_t")
        .replace("3p", "3p")
        .replace(/[^a-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "");
      const count = used[base] || 0;
      used[base] = count + 1;
      return count ? `${base}_${count + 1}` : base;
    }

    function stripAwardLeaguePrefix(label) {
      let value = cleanAccoladeLabel(label);
      awardLeagueCodes().some((code) => {
        const escaped = code.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const match = value.match(new RegExp(`^${escaped}\\s+`, "i"));
        if (!match) return false;
        value = value.slice(match[0].length).trim();
        return true;
